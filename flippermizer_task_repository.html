<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flippermizer Task Repository</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05111c;
  --bg2:#071826;
  --panel:#0b1f31;
  --panel2:#102a3d;
  --ink:#e9fbff;
  --muted:#9bc9d4;
  --line:#28d7ff;
  --green:#20e694;
  --gold:#ffcf6c;
  --orange:#ff9a59;
  --red:#ff657c;
  --violet:#b88cff;
  --shadow:rgba(0,0,0,.36);
}
*{ box-sizing:border-box; }
html,body{
  margin:0;
  min-height:100%;
  background:
    radial-gradient(circle at 22% 8%, rgba(40,215,255,.16), transparent 28%),
    linear-gradient(135deg, #071522, #05111c 54%, #0b1221);
  color:var(--ink);
  font-family:"Press Start 2P", monospace;
}
body{
  min-height:100vh;
  overflow:hidden;
}
button,
input,
select,
textarea{
  font:inherit;
}
button{
  cursor:pointer;
}
.app{
  height:100vh;
  display:grid;
  grid-template-rows:auto minmax(0,1fr);
}
.topbar{
  border-bottom:1px solid rgba(40,215,255,.28);
  background:linear-gradient(90deg, rgba(8,31,48,.98), rgba(8,24,38,.94));
  box-shadow:0 12px 32px var(--shadow);
  padding:14px 18px 12px;
}
.titleRow{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
}
.titleBlock h1{
  margin:0;
  font-size:20px;
  line-height:1.45;
  color:#f3feff;
}
.titleBlock .sub{
  margin-top:8px;
  color:var(--muted);
  font-size:9px;
  line-height:1.8;
}
.topActions{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:8px;
  flex-wrap:wrap;
}
.toolbar{
  margin-top:12px;
  display:grid;
  grid-template-columns:minmax(220px, 1fr) 190px 190px auto;
  gap:10px;
  align-items:center;
}
.field,
.select,
.btn{
  min-height:38px;
  border:1px solid rgba(40,215,255,.36);
  border-radius:8px;
  background:rgba(4,14,25,.78);
  color:var(--ink);
  padding:10px 11px;
  font-size:9px;
  line-height:1.5;
}
.field:focus,
.select:focus,
.taskInput:focus,
.tooltipInput:focus,
.noteInput:focus{
  outline:2px solid rgba(32,230,148,.55);
  outline-offset:1px;
}
.btn{
  background:linear-gradient(180deg, rgba(18,54,75,.98), rgba(8,26,40,.98));
  text-transform:uppercase;
  color:#e9fdff;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);
}
.btn:hover{
  border-color:rgba(32,230,148,.72);
}
.btn.gold{ border-color:rgba(255,207,108,.62); color:#fff3cf; }
.btn.red{ border-color:rgba(255,101,124,.66); color:#ffdbe1; }
.btn.violet{ border-color:rgba(184,140,255,.64); color:#efe6ff; }
.main{
  min-height:0;
  display:grid;
  grid-template-columns:280px minmax(0,1fr) 340px;
}
.tables,
.queue{
  min-height:0;
  overflow:hidden;
  background:linear-gradient(180deg, rgba(8,28,44,.94), rgba(6,18,30,.96));
}
.tables{
  border-right:1px solid rgba(40,215,255,.22);
}
.queue{
  border-left:1px solid rgba(40,215,255,.22);
}
.sideHead{
  padding:13px 14px;
  border-bottom:1px solid rgba(40,215,255,.2);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.sideTitle{
  font-size:10px;
  color:#bdf5ff;
  line-height:1.5;
}
.pill{
  border:1px solid rgba(255,255,255,.14);
  border-radius:999px;
  padding:6px 8px;
  color:var(--muted);
  background:rgba(255,255,255,.04);
  font-size:7px;
  line-height:1.2;
  white-space:nowrap;
}
.tableList,
.queueList{
  height:calc(100% - 54px);
  overflow:auto;
  padding:10px;
}
.tableBtn{
  width:100%;
  text-align:left;
  border:1px solid rgba(40,215,255,.18);
  border-radius:8px;
  background:rgba(6,21,34,.72);
  color:var(--ink);
  padding:10px;
  display:grid;
  gap:8px;
  margin-bottom:8px;
}
.tableBtn.active{
  border-color:rgba(32,230,148,.78);
  background:linear-gradient(180deg, rgba(19,55,51,.9), rgba(8,28,40,.9));
}
.tableName{
  font-size:9px;
  line-height:1.5;
}
.tableMeta{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}
.workspace{
  min-height:0;
  overflow:auto;
  padding:14px;
}
.summaryGrid{
  display:grid;
  grid-template-columns:repeat(5, minmax(0,1fr));
  gap:10px;
  margin-bottom:12px;
}
.stat{
  border:1px solid rgba(40,215,255,.18);
  border-radius:8px;
  background:rgba(9,28,43,.72);
  padding:12px;
}
.stat .k{
  color:var(--muted);
  font-size:7px;
  line-height:1.5;
}
.stat .v{
  margin-top:8px;
  font-size:15px;
  color:#f6feff;
}
.tableHeader{
  border:1px solid rgba(40,215,255,.24);
  border-radius:8px;
  background:linear-gradient(135deg, rgba(10,37,56,.84), rgba(12,27,42,.88));
  padding:14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:12px;
}
.tableHeader h2{
  margin:0;
  font-size:16px;
  line-height:1.55;
}
.tableHeader .meta{
  margin-top:8px;
  color:var(--muted);
  font-size:8px;
  line-height:1.6;
}
.viewTabs{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.tabBtn{
  border:1px solid rgba(40,215,255,.26);
  border-radius:8px;
  background:rgba(7,20,32,.86);
  color:var(--muted);
  padding:9px 10px;
  font-size:8px;
}
.tabBtn.active{
  border-color:rgba(255,207,108,.66);
  color:#fff2c5;
  background:rgba(54,41,14,.72);
}
.tabBtn.templateOn{
  border-color:rgba(32,230,148,.7);
  color:#caffea;
  background:rgba(13,58,40,.72);
}
.difficultyBlock{
  margin-bottom:14px;
  border:1px solid rgba(40,215,255,.2);
  border-radius:8px;
  overflow:hidden;
  background:rgba(5,18,29,.54);
}
.difficultyHead{
  padding:11px 12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid rgba(40,215,255,.16);
  background:rgba(16,42,60,.68);
}
.difficultyHead .label{
  font-size:10px;
  color:#dffbff;
}
.rows{
  display:grid;
  gap:10px;
  padding:10px;
}
.taskCard{
  border:1px solid rgba(255,255,255,.12);
  border-radius:8px;
  background:linear-gradient(180deg, rgba(12,31,46,.9), rgba(8,23,35,.9));
  padding:11px;
  display:grid;
  grid-template-columns:minmax(0,1fr) 220px;
  gap:12px;
}
.taskCard.flagged{
  border-color:rgba(255,207,108,.42);
}
.taskCard.impossible{
  border-color:rgba(255,101,124,.48);
}
.taskCard.groupCard{
  grid-template-columns:minmax(0,1fr) 260px;
  border-color:rgba(184,140,255,.32);
}
.groupPlacements{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-bottom:8px;
}
.groupApplyHint{
  color:var(--muted);
  font-size:7px;
  line-height:1.7;
}
.taskEditGrid{
  display:grid;
  grid-template-columns:120px minmax(0,1fr);
  gap:8px;
  align-items:start;
}
.label{
  color:var(--muted);
  font-size:7px;
  line-height:1.6;
  padding-top:9px;
}
.taskInput,
.tooltipInput,
.noteInput{
  width:100%;
  min-width:0;
  border:1px solid rgba(40,215,255,.2);
  border-radius:8px;
  background:rgba(3,12,20,.78);
  color:var(--ink);
  padding:9px 10px;
  font-size:9px;
  line-height:1.65;
  resize:vertical;
}
.taskInput{ min-height:42px; }
.tooltipInput{ min-height:110px; }
.noteInput{ min-height:58px; }
.rowMeta{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-top:8px;
}
.badge{
  border:1px solid rgba(255,255,255,.14);
  border-radius:999px;
  color:var(--muted);
  background:rgba(255,255,255,.04);
  padding:5px 7px;
  font-size:7px;
  line-height:1.2;
}
.badge.green{ color:#caffea; border-color:rgba(32,230,148,.42); }
.badge.gold{ color:#ffefbf; border-color:rgba(255,207,108,.45); }
.badge.red{ color:#ffd6dd; border-color:rgba(255,101,124,.44); }
.badge.violet{ color:#eadfff; border-color:rgba(184,140,255,.46); }
.flagPanel{
  border-left:1px solid rgba(255,255,255,.1);
  padding-left:12px;
  display:grid;
  align-content:start;
  gap:9px;
}
.flagGroup{
  display:grid;
  gap:6px;
}
.flagGroup label{
  color:var(--muted);
  font-size:7px;
  line-height:1.4;
}
.flagSelect{
  width:100%;
  border:1px solid rgba(40,215,255,.24);
  border-radius:8px;
  background:rgba(3,12,20,.82);
  color:var(--ink);
  padding:8px;
  font-size:8px;
  line-height:1.5;
}
.guideBox{
  margin-top:8px;
  border:1px solid rgba(184,140,255,.22);
  border-radius:8px;
  background:rgba(26,20,44,.35);
  padding:9px 10px;
  color:#d9ccff;
  font-size:8px;
  line-height:1.7;
}
.emptyState{
  border:1px dashed rgba(40,215,255,.28);
  border-radius:8px;
  padding:18px;
  color:var(--muted);
  font-size:10px;
  line-height:1.8;
  background:rgba(8,23,35,.55);
}
.queueItem{
  border:1px solid rgba(255,255,255,.12);
  border-radius:8px;
  background:rgba(7,22,34,.78);
  padding:10px;
  margin-bottom:10px;
}
.queueItem .qTitle{
  font-size:8px;
  line-height:1.6;
  color:#f7feff;
}
.queueItem .qMeta{
  margin-top:7px;
  color:var(--muted);
  font-size:7px;
  line-height:1.6;
}
.queuePreview{
  margin-top:9px;
  color:#d8f7ff;
  font-size:7px;
  line-height:1.6;
  max-height:90px;
  overflow:auto;
  border-top:1px solid rgba(255,255,255,.08);
  padding-top:8px;
}
.reviewStack{
  display:grid;
  gap:12px;
}
.reviewCard{
  border:1px solid rgba(40,215,255,.2);
  border-radius:8px;
  background:linear-gradient(180deg, rgba(11,31,47,.9), rgba(7,22,34,.92));
  padding:12px;
}
.reviewCard.pendingCodex{
  border-color:rgba(255,207,108,.48);
}
.reviewCard.accepted{
  border-color:rgba(32,230,148,.42);
}
.reviewHead{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  margin-bottom:10px;
}
.reviewTitle{
  font-size:10px;
  line-height:1.6;
  color:#f4feff;
}
.reviewMeta{
  margin-top:7px;
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}
.reviewCols{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.reviewCol{
  border:1px solid rgba(255,255,255,.1);
  border-radius:8px;
  background:rgba(3,12,20,.45);
  padding:10px;
  min-width:0;
}
.reviewCol h3{
  margin:0 0 8px;
  color:var(--muted);
  font-size:8px;
  line-height:1.5;
}
.reviewText{
  color:#eafcff;
  font-size:8px;
  line-height:1.75;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.reviewText.empty{
  color:#7eaab8;
}
.reviewActions{
  margin-top:10px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.miniAction{
  border:1px solid rgba(40,215,255,.28);
  border-radius:8px;
  background:rgba(8,25,38,.9);
  color:#e9fdff;
  padding:8px 9px;
  font-size:7px;
  line-height:1.3;
}
.miniAction.gold{ border-color:rgba(255,207,108,.55); color:#fff1c8; }
.miniAction.green{ border-color:rgba(32,230,148,.55); color:#d9fff0; }
.miniAction.red{ border-color:rgba(255,101,124,.56); color:#ffd9df; }
.toast{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:20;
  border:1px solid rgba(32,230,148,.55);
  border-radius:8px;
  background:rgba(7,28,33,.96);
  color:#d9fff1;
  padding:12px 14px;
  font-size:8px;
  line-height:1.6;
  box-shadow:0 12px 32px var(--shadow);
  opacity:0;
  transform:translateY(8px);
  pointer-events:none;
  transition:opacity .18s ease, transform .18s ease;
}
.toast.show{
  opacity:1;
  transform:translateY(0);
}
.hiddenFile{
  position:absolute;
  width:1px;
  height:1px;
  opacity:0;
  pointer-events:none;
}
@media (max-width:1280px){
  body{ overflow:auto; }
  .app{ min-height:100vh; height:auto; }
  .main{ grid-template-columns:240px minmax(0,1fr); }
  .queue{ grid-column:1 / -1; border-left:0; border-top:1px solid rgba(40,215,255,.22); min-height:320px; }
  .queueList{ height:320px; }
  .summaryGrid{ grid-template-columns:repeat(3, minmax(0,1fr)); }
}
@media (max-width:820px){
  .toolbar{ grid-template-columns:1fr; }
  .main{ grid-template-columns:1fr; }
  .tables{ border-right:0; border-bottom:1px solid rgba(40,215,255,.22); max-height:320px; }
  .tableList{ height:260px; }
  .taskCard{ grid-template-columns:1fr; }
  .flagPanel{ border-left:0; border-top:1px solid rgba(255,255,255,.1); padding-left:0; padding-top:10px; }
  .taskEditGrid{ grid-template-columns:1fr; }
  .label{ padding-top:0; }
  .summaryGrid{ grid-template-columns:repeat(2, minmax(0,1fr)); }
  .titleRow{ align-items:flex-start; flex-direction:column; }
  .topActions{ justify-content:flex-start; }
  .reviewCols{ grid-template-columns:1fr; }
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="titleRow">
      <div class="titleBlock">
        <h1>Task Repository</h1>
        <div class="sub" id="sourceSummary">Loading task source...</div>
      </div>
      <div class="topActions">
        <button class="btn gold" id="exportCfgBtn" type="button">Save CFG</button>
        <button class="btn gold" id="exportBuildCfgBtn" type="button">Save Build CFG</button>
        <button class="btn violet" id="copyQueueBtn" type="button">Copy Codex Queue</button>
        <button class="btn violet" id="copyTemplateGuideBtn" type="button">Copy Templates</button>
        <button class="btn" id="importCfgBtn" type="button">Import CFG</button>
        <button class="btn red" id="resetCfgBtn" type="button">Reset Local</button>
      </div>
    </div>
    <div class="toolbar">
      <input class="field" id="searchInput" type="search" placeholder="Search table, task, tooltip, flag..." autocomplete="off" />
      <select class="select" id="filterSelect">
        <option value="all">All entries</option>
        <option value="flagged">Flagged</option>
        <option value="edited">Edited</option>
        <option value="pending_codex">Pending Codex</option>
        <option value="accepted">Accepted</option>
        <option value="templates">Template tables</option>
        <option value="rewrite">Full rewrite</option>
        <option value="impossible">Task Impossible</option>
        <option value="missing_tooltip">No source tooltip</option>
      </select>
      <select class="select" id="tableSortSelect">
        <option value="name">Sort by table</option>
        <option value="code">Sort by code</option>
        <option value="source">Source order</option>
        <option value="flagged">Flagged first</option>
        <option value="templates">Templates first</option>
      </select>
      <div class="pill" id="saveStatus">LOCAL READY</div>
    </div>
  </header>
  <div class="main">
    <aside class="tables">
      <div class="sideHead">
        <div class="sideTitle">TABLES</div>
        <div class="pill" id="tableCountPill">0</div>
      </div>
      <div class="tableList" id="tableList"></div>
    </aside>
    <main class="workspace">
      <div class="summaryGrid" id="summaryGrid"></div>
      <section class="tableHeader">
        <div>
          <h2 id="currentTableTitle">Select a table</h2>
          <div class="meta" id="currentTableMeta">Tasks and tooltip drafts are grouped by table.</div>
        </div>
        <div class="viewTabs" id="viewTabs">
          <button class="tabBtn active" type="button" data-view="tasks">TASKS</button>
          <button class="tabBtn" type="button" data-view="groups">GROUPS</button>
          <button class="tabBtn" type="button" data-view="tooltips">TOOLTIPS</button>
          <button class="tabBtn" type="button" data-view="queue">FLAGS</button>
          <button class="tabBtn" type="button" data-view="review">REVIEW</button>
          <button class="tabBtn" id="templateToggleBtn" type="button" data-action="toggle-template">MARK TEMPLATE</button>
        </div>
      </section>
      <section id="contentHost"></section>
    </main>
    <aside class="queue">
      <div class="sideHead">
        <div class="sideTitle">CODEX QUEUE</div>
        <div class="pill" id="queueCountPill">0</div>
      </div>
      <div class="queueList" id="queueList"></div>
    </aside>
  </div>
</div>
<input class="hiddenFile" id="cfgFileInput" type="file" accept=".json,.cfg,application/json" />
<div class="toast" id="toast"></div>
<script src="./flippermizer_table_repository.js"></script>
<script src="./flippermizer_task_explanations.js"></script>
<script src="./flippermizer_task_repository_data.js"></script>
<script src="./flippermizer_task_repository_cfg.js"></script>
<script>
(function(){
  "use strict";

  var STORAGE_KEY = "flpr_task_repository_cfg_v1";
  var FLAG_TYPES = {
    full_rewrite: {
      label: "Full rewrite",
      request: "Look at the Guide again, and better align with what the Task is asking."
    },
    task_impossible: {
      label: "Task Impossible",
      request: "Task Not Suitable for Attempting."
    }
  };
  var DIFFICULTY_ORDER = ["Easy", "Medium", "Hard"];

  var els = {
    sourceSummary: document.getElementById("sourceSummary"),
    tableList: document.getElementById("tableList"),
    tableCountPill: document.getElementById("tableCountPill"),
    queueCountPill: document.getElementById("queueCountPill"),
    queueList: document.getElementById("queueList"),
    contentHost: document.getElementById("contentHost"),
    summaryGrid: document.getElementById("summaryGrid"),
    currentTableTitle: document.getElementById("currentTableTitle"),
    currentTableMeta: document.getElementById("currentTableMeta"),
    searchInput: document.getElementById("searchInput"),
    filterSelect: document.getElementById("filterSelect"),
    tableSortSelect: document.getElementById("tableSortSelect"),
    templateToggleBtn: document.getElementById("templateToggleBtn"),
    saveStatus: document.getElementById("saveStatus"),
    cfgFileInput: document.getElementById("cfgFileInput"),
    toast: document.getElementById("toast")
  };

  var source = window.FLPR_TASK_REPOSITORY_SOURCE || {};
  var pools = source.pools || {};
  var rows = [];
  var rowsById = new Map();
  var tables = [];
  var guideCache = new Map();
  var saveTimer = null;
  var toastTimer = null;

  var state = {
    selectedTable: "",
    view: "tasks",
    query: "",
    filter: "all",
    sort: "name",
    cfg: loadLocalCfg()
  };

  function escapeHtml(value){
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function escapeAttr(value){
    return escapeHtml(value).replace(/`/g, "&#96;");
  }

  function normalizeTable(value){
    try{
      var exp = window.FLPR_TASK_EXPLANATIONS;
      if(exp && typeof exp.normalizeTableKey === "function") return exp.normalizeTableKey(value);
    }catch(_){}
    return String(value || "").toLowerCase().replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim();
  }

  function normalizeTask(value){
    try{
      var exp = window.FLPR_TASK_EXPLANATIONS;
      if(exp && typeof exp.normalizeTaskKey === "function") return exp.normalizeTaskKey(value);
    }catch(_){}
    return String(value || "").toLowerCase().replace(/[^a-z0-9%+ ]+/g, " ").replace(/\s+/g, " ").trim();
  }

  function repoMetaForTable(tableName){
    try{
      var repo = window.FLPR_TABLE_REPO;
      var meta = repo && typeof repo.getTableMeta === "function" ? repo.getTableMeta(tableName) : null;
      if(meta) return meta;
    }catch(_){}
    return { code:"", name:String(tableName || "").trim(), displayName:String(tableName || "").trim(), manufacturer:"", year:null };
  }

  function sourceTaskId(tableName, difficulty, index, task){
    return [
      normalizeTable(tableName),
      String(difficulty || "").toLowerCase(),
      String(index || 0),
      normalizeTask(task && (task.title || task.name || task.objective || ""))
    ].join("|");
  }

  function buildRows(){
    var order = 0;
    Object.keys(pools || {}).forEach(function(tableName){
      var meta = repoMetaForTable(tableName);
      var diffs = pools[tableName] || {};
      DIFFICULTY_ORDER.forEach(function(difficulty){
        var list = Array.isArray(diffs[difficulty]) ? diffs[difficulty] : [];
        list.forEach(function(task, index){
          var title = String(task && (task.title || task.objective || task.name || "") || "").trim();
          if(!title) return;
          var row = {
            id: sourceTaskId(tableName, difficulty, index, task),
            sourceOrder: order++,
            tableName: String(tableName || "").trim(),
            tableKey: normalizeTable(tableName),
            tableCode: String(meta.code || "").trim(),
            tableDisplayName: String(meta.displayName || meta.name || tableName || "").trim(),
            manufacturer: String(meta.manufacturer || "").trim(),
            year: meta.year || null,
            difficulty: difficulty,
            difficultyIndex: DIFFICULTY_ORDER.indexOf(difficulty),
            index: index,
            originalTitle: title,
            originalType: String(task && (task.type || task.kind || "task") || "task").trim() || "task",
            sourceExplanation: String(task && (task.explanation || "") || "").trim(),
            sourceLocation: String(task && (task.source_location || task.sourceLocation || "") || "").trim(),
            raw: task || {}
          };
          rows.push(row);
          rowsById.set(row.id, row);
        });
      });
    });

    var tableMap = new Map();
    rows.forEach(function(row){
      var key = row.tableKey || normalizeTable(row.tableName);
      if(!tableMap.has(key)){
        tableMap.set(key, {
          key: key,
          sourceOrder: row.sourceOrder,
          name: row.tableName,
          displayName: row.tableDisplayName || row.tableName,
          code: row.tableCode,
          manufacturer: row.manufacturer,
          year: row.year,
          count: 0
        });
      }
      tableMap.get(key).count++;
    });
    tables = Array.from(tableMap.values());
    if(!state.selectedTable && tables.length) state.selectedTable = sortTables(tables)[0].key;
  }

  function cleanHowTo(value){
    return String(value || "").replace(/^How to Achieve:\s*/i, "").trim();
  }

  function guideMetaFor(row){
    if(!row) return { text:"", kind:"none" };
    if(guideCache.has(row.id)) return guideCache.get(row.id);
    var meta = { text:"", kind:"none" };
    try{
      var getter = window.flprGetTaskExplanationMeta || (window.FLPR_TASK_EXPLANATIONS && window.FLPR_TASK_EXPLANATIONS.resolveTaskExplanationMeta);
      if(typeof getter === "function"){
        var node = {
          tableName: row.tableName,
          table: row.tableName,
          target_table: row.tableName,
          source_location: row.sourceLocation,
          full: row.sourceLocation || (row.tableName + " - " + row.originalTitle),
          location: row.sourceLocation || (row.tableName + " - " + row.originalTitle),
          genericEntry: row.raw
        };
        var resolved = getter(row.originalTitle, node) || {};
        meta = {
          text: cleanHowTo(resolved.text || ""),
          kind: String(resolved.kind || "none"),
          tableName: String(resolved.tableName || row.tableName || "")
        };
      }
    }catch(_){}
    guideCache.set(row.id, meta);
    return meta;
  }

  function originalField(row, field){
    if(field === "title") return row.originalTitle;
    if(field === "type") return row.originalType;
    if(field === "tooltip") return row.sourceExplanation || guideMetaFor(row).text || "";
    if(field === "note") return "";
    return "";
  }

  function hasOwn(obj, key){
    return Object.prototype.hasOwnProperty.call(obj || {}, key);
  }

  function tableTemplateFor(tableKey){
    return state.cfg.templateTables && state.cfg.templateTables[tableKey] || null;
  }

  function isTemplateTable(tableKey){
    return !!tableTemplateFor(tableKey);
  }

  function toggleTemplateTable(tableKey){
    if(!tableKey) return;
    state.cfg.templateTables = state.cfg.templateTables || {};
    if(state.cfg.templateTables[tableKey]){
      delete state.cfg.templateTables[tableKey];
    }else{
      var table = tables.find(function(item){ return item.key === tableKey; }) || {};
      state.cfg.templateTables[tableKey] = {
        table: table.name || table.displayName || tableKey,
        tableCode: table.code || "",
        markedAt: nowIso()
      };
    }
    scheduleSave();
  }

  function editedValue(row, field){
    var edit = state.cfg.edits && state.cfg.edits[row.id];
    if(edit && hasOwn(edit, field)) return String(edit[field] == null ? "" : edit[field]);
    return originalField(row, field);
  }

  function nowIso(){
    return new Date().toISOString();
  }

  function recordHistory(id, sourceName, fields, values){
    if(!id || !sourceName) return;
    state.cfg.history = state.cfg.history || {};
    var rowHistory = Object.assign({}, state.cfg.history[id] || {});
    var sourceHistory = Object.assign({}, rowHistory[sourceName] || {});
    sourceHistory.updatedAt = nowIso();
    sourceHistory.fields = Array.from(new Set([].concat(sourceHistory.fields || [], fields || []).filter(Boolean)));
    sourceHistory.values = Object.assign({}, sourceHistory.values || {}, values || {});
    rowHistory[sourceName] = sourceHistory;
    state.cfg.history[id] = rowHistory;
  }

  function setEditField(id, field, value, origin){
    var row = rowsById.get(id);
    if(!row) return;
    state.cfg.edits = state.cfg.edits || {};
    var edit = Object.assign({}, state.cfg.edits[id] || {});
    var clean = String(value == null ? "" : value);
    if(clean === originalField(row, field)){
      delete edit[field];
    }else{
      edit[field] = clean;
    }
    edit.updatedAt = nowIso();
    var keys = Object.keys(edit).filter(function(k){ return k !== "updatedAt"; });
    if(keys.length) state.cfg.edits[id] = edit;
    else delete state.cfg.edits[id];
    recordHistory(id, origin === "codex" ? "codex" : "manual", [field], { [field]: clean });
    scheduleSave();
  }

  function setEditFields(id, values, origin){
    var row = rowsById.get(id);
    if(!row || !values || typeof values !== "object") return;
    Object.keys(values).forEach(function(field){
      if(!["title", "type", "tooltip", "note"].includes(field)) return;
      setEditField(id, field, values[field], origin);
    });
  }

  function getFlag(id, target){
    return String((state.cfg.flags && state.cfg.flags[id] && state.cfg.flags[id][target]) || "");
  }

  function setFlag(id, target, value){
    state.cfg.flags = state.cfg.flags || {};
    var rowFlags = Object.assign({}, state.cfg.flags[id] || {});
    var clean = String(value || "");
    if(clean) rowFlags[target] = clean;
    else delete rowFlags[target];
    if(clean && state.cfg.accepted) delete state.cfg.accepted[id];
    if(Object.keys(rowFlags).length){
      rowFlags.updatedAt = nowIso();
      state.cfg.flags[id] = rowFlags;
    }else{
      delete state.cfg.flags[id];
    }
    scheduleSave();
  }

  function suggestionFor(row){
    return row && state.cfg.codexSuggestions ? state.cfg.codexSuggestions[row.id] || null : null;
  }

  function acceptedFor(row){
    return row && state.cfg.accepted ? state.cfg.accepted[row.id] || null : null;
  }

  function hasPendingCodex(row){
    var suggestion = suggestionFor(row);
    if(!suggestion) return false;
    var accepted = acceptedFor(row);
    return !(accepted && accepted.source === "codex" && accepted.suggestionUpdatedAt === suggestion.updatedAt);
  }

  function acceptSuggestion(id){
    var row = rowsById.get(id);
    var suggestion = row ? suggestionFor(row) : null;
    if(!row || !suggestion) return;
    var values = {};
    ["title", "type", "tooltip", "note"].forEach(function(field){
      if(hasOwn(suggestion, field) && String(suggestion[field] == null ? "" : suggestion[field]).trim()){
        values[field] = String(suggestion[field]);
      }
    });
    if(!Object.keys(values).length) return;
    setEditFields(id, values, "codex");
    state.cfg.flags = state.cfg.flags || {};
    delete state.cfg.flags[id];
    state.cfg.accepted = state.cfg.accepted || {};
    state.cfg.accepted[id] = {
      source: "codex",
      updatedAt: nowIso(),
      suggestionUpdatedAt: String(suggestion.updatedAt || ""),
      fields: Object.keys(values)
    };
    recordHistory(id, "accepted", Object.keys(values), values);
    scheduleSave();
  }

  function acceptCurrent(id){
    var row = rowsById.get(id);
    if(!row) return;
    var edit = state.cfg.edits && state.cfg.edits[id] || {};
    var fields = Object.keys(edit).filter(function(field){ return ["title", "type", "tooltip", "note"].includes(field); });
    state.cfg.flags = state.cfg.flags || {};
    delete state.cfg.flags[id];
    state.cfg.accepted = state.cfg.accepted || {};
    state.cfg.accepted[id] = {
      source: "manual",
      updatedAt: nowIso(),
      editUpdatedAt: String(edit.updatedAt || ""),
      fields: fields
    };
    recordHistory(id, "accepted", fields, fields.reduce(function(out, field){
      out[field] = editedValue(row, field);
      return out;
    }, {}));
    scheduleSave();
  }

  function rowEdited(row){
    return !!(row && state.cfg.edits && state.cfg.edits[row.id]);
  }

  function rowFlagged(row){
    return !!(row && state.cfg.flags && state.cfg.flags[row.id] && (state.cfg.flags[row.id].task || state.cfg.flags[row.id].tooltip));
  }

  function rowHasFlagType(row, flagType){
    var flags = state.cfg.flags && state.cfg.flags[row.id];
    return !!(flags && (flags.task === flagType || flags.tooltip === flagType));
  }

  function rowSearchText(row){
    var flags = state.cfg.flags && state.cfg.flags[row.id] || {};
    var suggestion = suggestionFor(row) || {};
    return [
      row.tableName,
      row.tableDisplayName,
      row.tableCode,
      row.difficulty,
      row.originalTitle,
      editedValue(row, "title"),
      row.sourceExplanation,
      editedValue(row, "tooltip"),
      guideMetaFor(row).text,
      flags.task,
      flags.tooltip,
      editedValue(row, "note"),
      suggestion.title,
      suggestion.tooltip,
      suggestion.note,
      suggestion.replacement_reason
    ].join(" ").toLowerCase();
  }

  function passesFilter(row){
    var filter = state.filter || "all";
    if(filter === "flagged") return rowFlagged(row);
    if(filter === "edited") return rowEdited(row);
    if(filter === "pending_codex") return hasPendingCodex(row);
    if(filter === "accepted") return !!acceptedFor(row);
    if(filter === "templates") return isTemplateTable(row.tableKey);
    if(filter === "rewrite") return rowHasFlagType(row, "full_rewrite");
    if(filter === "impossible") return rowHasFlagType(row, "task_impossible");
    if(filter === "missing_tooltip") return !row.sourceExplanation;
    return true;
  }

  function visibleRowsForTable(tableKey){
    var query = String(state.query || "").trim().toLowerCase();
    return rows.filter(function(row){
      if(tableKey && row.tableKey !== tableKey) return false;
      if(!passesFilter(row)) return false;
      if(query && !rowSearchText(row).includes(query)) return false;
      return true;
    });
  }

  function sortTables(list){
    var out = list.slice();
    var sort = state.sort || "name";
    out.sort(function(a, b){
      if(sort === "source") return a.sourceOrder - b.sourceOrder;
      if(sort === "code") return String(a.code || a.displayName).localeCompare(String(b.code || b.displayName));
      if(sort === "flagged"){
        var af = countTableFlags(a.key);
        var bf = countTableFlags(b.key);
        if(af !== bf) return bf - af;
      }
      if(sort === "templates"){
        var at = isTemplateTable(a.key) ? 1 : 0;
        var bt = isTemplateTable(b.key) ? 1 : 0;
        if(at !== bt) return bt - at;
      }
      return String(a.displayName || a.name).localeCompare(String(b.displayName || b.name));
    });
    return out;
  }

  function countTableFlags(tableKey){
    return rows.filter(function(row){ return row.tableKey === tableKey && rowFlagged(row); }).length;
  }

  function countTableEdits(tableKey){
    return rows.filter(function(row){ return row.tableKey === tableKey && rowEdited(row); }).length;
  }

  function countTableCodex(tableKey){
    return rows.filter(function(row){ return row.tableKey === tableKey && hasPendingCodex(row); }).length;
  }

  function countTemplateTables(){
    return Object.keys(state.cfg.templateTables || {}).filter(function(tableKey){
      return tables.some(function(table){ return table.key === tableKey; });
    }).length;
  }

  function loadLocalCfg(){
    var packaged = normalizeCfg(window.FLPR_TASK_REPOSITORY_DEFAULT_CFG || {});
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return packaged;
      var parsed = JSON.parse(raw);
      return mergeCfg(packaged, normalizeCfg(parsed));
    }catch(_){
      return packaged;
    }
  }

  function emptyCfg(){
    return {
      kind: "flippermizer_task_repository_cfg",
      version: "1.0.0",
      updatedAt: "",
      edits: {},
      flags: {},
      codexSuggestions: {},
      accepted: {},
      templateTables: {},
      history: {}
    };
  }

  function normalizeCfg(value){
    var cfg = value && typeof value === "object" ? value : {};
    var edits = cfg.edits && typeof cfg.edits === "object" ? cfg.edits : {};
    var flags = cfg.flags && typeof cfg.flags === "object" ? cfg.flags : {};
    var codexSuggestions = cfg.codexSuggestions && typeof cfg.codexSuggestions === "object" ? cfg.codexSuggestions : {};
    var accepted = cfg.accepted && typeof cfg.accepted === "object" ? cfg.accepted : {};
    var templateTables = cfg.templateTables && typeof cfg.templateTables === "object" ? cfg.templateTables : {};
    var history = cfg.history && typeof cfg.history === "object" ? cfg.history : {};
    return {
      kind: "flippermizer_task_repository_cfg",
      version: String(cfg.version || "1.0.0"),
      updatedAt: String(cfg.updatedAt || cfg.savedAt || ""),
      edits: edits,
      flags: flags,
      codexSuggestions: codexSuggestions,
      accepted: accepted,
      templateTables: templateTables,
      history: history
    };
  }

  function mergeCfg(base, overlay){
    var out = normalizeCfg(base);
    var next = normalizeCfg(overlay);
    out.updatedAt = next.updatedAt || out.updatedAt;
    out.edits = Object.assign({}, out.edits || {}, next.edits || {});
    out.flags = Object.assign({}, out.flags || {}, next.flags || {});
    out.codexSuggestions = Object.assign({}, out.codexSuggestions || {}, next.codexSuggestions || {});
    out.accepted = Object.assign({}, out.accepted || {}, next.accepted || {});
    out.templateTables = Object.assign({}, out.templateTables || {}, next.templateTables || {});
    out.history = Object.assign({}, out.history || {}, next.history || {});
    return out;
  }

  function scheduleSave(){
    state.cfg.updatedAt = new Date().toISOString();
    els.saveStatus.textContent = "LOCAL SAVING";
    if(saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      saveTimer = null;
      try{
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.cfg));
        els.saveStatus.textContent = "LOCAL SAVED";
        renderStats();
        renderTables();
        renderQueueAside();
      }catch(_){
        els.saveStatus.textContent = "LOCAL SAVE FAILED";
      }
    }, 180);
  }

  function showToast(text){
    if(toastTimer) clearTimeout(toastTimer);
    els.toast.textContent = String(text || "");
    els.toast.classList.add("show");
    toastTimer = setTimeout(function(){ els.toast.classList.remove("show"); }, 1800);
  }

  function buildReviewQueue(){
    var queue = [];
    rows.forEach(function(row){
      var flags = state.cfg.flags && state.cfg.flags[row.id];
      var edit = state.cfg.edits && state.cfg.edits[row.id];
      if(!flags && !edit) return;
      var taskFlag = String(flags && flags.task || "");
      var tooltipFlag = String(flags && flags.tooltip || "");
      if(!taskFlag && !tooltipFlag && !edit) return;
      var guide = guideMetaFor(row);
      var suggestion = suggestionFor(row);
      var accepted = acceptedFor(row);
      queue.push({
        id: row.id,
        table: row.tableName,
        tableCode: row.tableCode,
        difficulty: row.difficulty,
        sourceLocation: row.sourceLocation,
        flags: {
          task: taskFlag || null,
          tooltip: tooltipFlag || null
        },
        flagRequests: {
          task: taskFlag && FLAG_TYPES[taskFlag] ? FLAG_TYPES[taskFlag].request : "",
          tooltip: tooltipFlag && FLAG_TYPES[tooltipFlag] ? FLAG_TYPES[tooltipFlag].request : ""
        },
        original: {
          title: row.originalTitle,
          type: row.originalType,
          sourceTooltip: row.sourceExplanation,
          guideTooltip: guide.text,
          guideKind: guide.kind
        },
        edited: {
          title: editedValue(row, "title"),
          type: editedValue(row, "type"),
          tooltip: editedValue(row, "tooltip"),
          note: editedValue(row, "note")
        },
        reviewState: {
          manualUpdatedAt: String(edit && edit.updatedAt || ""),
          codexUpdatedAt: String(suggestion && suggestion.updatedAt || ""),
          acceptedAt: String(accepted && accepted.updatedAt || ""),
          acceptedSource: String(accepted && accepted.source || ""),
          pendingCodex: hasPendingCodex(row),
          codexSuggestion: suggestion || null
        }
      });
    });
    return queue;
  }

  function reviewQueueGroupKey(item){
    var tableKey = normalizeTable(item && item.table || "");
    var taskKey = normalizeTask(
      item && item.sourceLocation ||
      item && item.original && item.original.title ||
      item && item.edited && item.edited.title ||
      ""
    );
    return tableKey && taskKey ? tableKey + "|" + taskKey : "";
  }

  function uniqueCleanValues(values){
    var seen = new Set();
    var out = [];
    (values || []).forEach(function(value){
      var clean = String(value || "").trim();
      if(!clean || seen.has(clean)) return;
      seen.add(clean);
      out.push(clean);
    });
    return out;
  }

  function buildReviewGroups(queue){
    var groups = {};
    (queue || []).forEach(function(item){
      var key = reviewQueueGroupKey(item);
      if(!key) return;
      if(!groups[key]){
        groups[key] = {
          group_id: key,
          ids: [],
          table: item.table,
          tableCode: item.tableCode,
          title: item.edited && item.edited.title || item.original && item.original.title || "",
          type: item.edited && item.edited.type || item.original && item.original.type || "task",
          flags: { task: null, tooltip: null },
          flagRequests: { task: "", tooltip: "" },
          placements: [],
          guideContext: []
        };
      }
      var group = groups[key];
      group.ids.push(item.id);
      group.placements.push({
        id: item.id,
        difficulty: item.difficulty,
        sourceLocation: item.sourceLocation
      });
      if(item.flags && item.flags.task) group.flags.task = item.flags.task;
      if(item.flags && item.flags.tooltip) group.flags.tooltip = item.flags.tooltip;
      if(item.flagRequests && item.flagRequests.task) group.flagRequests.task = item.flagRequests.task;
      if(item.flagRequests && item.flagRequests.tooltip) group.flagRequests.tooltip = item.flagRequests.tooltip;
      if(item.original && item.original.guideTooltip) group.guideContext.push(item.original.guideTooltip);
      if(item.original && item.original.sourceTooltip) group.guideContext.push(item.original.sourceTooltip);
    });
    return Object.keys(groups).map(function(key){
      var group = groups[key];
      group.guideContext = uniqueCleanValues(group.guideContext);
      return group;
    }).filter(function(group){ return group.ids.length > 1; });
  }

  function buildTemplateGuide(){
    var templateKeys = Object.keys(state.cfg.templateTables || {}).filter(function(tableKey){
      return tables.some(function(table){ return table.key === tableKey; });
    });
    return {
      kind: "flippermizer_task_template_guide",
      version: "1.0.0",
      exportedAt: new Date().toISOString(),
      editTypes: {
        full_rewrite: FLAG_TYPES.full_rewrite.request,
        task_impossible: FLAG_TYPES.task_impossible.request
      },
      templateTables: templateKeys.map(function(tableKey){
        var table = tables.find(function(item){ return item.key === tableKey; }) || {};
        var tableRows = rows.filter(function(row){ return row.tableKey === tableKey; });
        var repeated = {};
        tableRows.forEach(function(row){
          var key = rowTaskGroupKey(row);
          if(!key) return;
          (repeated[key] || (repeated[key] = [])).push(row);
        });
        var groups = Object.keys(repeated).map(function(key){
          var groupRows = repeated[key].slice().sort(function(a, b){
            return a.difficultyIndex - b.difficultyIndex || a.index - b.index;
          });
          if(groupRows.length < 2) return null;
          return {
            group_id: key,
            ids: groupRows.map(function(row){ return row.id; }),
            placements: groupRows.map(function(row){
              return { difficulty: row.difficulty, index: row.index, sourceLocation: row.sourceLocation };
            }),
            title: groupFieldValue(groupRows, "title"),
            type: groupFieldValue(groupRows, "type"),
            tooltip: groupFieldValue(groupRows, "tooltip"),
            notes: groupFieldValue(groupRows, "note")
          };
        }).filter(Boolean);
        return {
          table: table.name || table.displayName || tableKey,
          tableCode: table.code || "",
          markedAt: String((state.cfg.templateTables[tableKey] || {}).markedAt || ""),
          rows: tableRows.map(function(row){
            return {
              id: row.id,
              difficulty: row.difficulty,
              index: row.index,
              sourceLocation: row.sourceLocation,
              title: editedValue(row, "title"),
              type: editedValue(row, "type"),
              tooltip: editedValue(row, "tooltip"),
              notes: editedValue(row, "note"),
              guideTooltip: guideMetaFor(row).text,
              flags: state.cfg.flags && state.cfg.flags[row.id] || null,
              accepted: acceptedFor(row) || null
            };
          }),
          groupedPlacements: groups
        };
      })
    };
  }

  function exportPayload(){
    var queue = buildReviewQueue();
    return {
      kind: "flippermizer_task_repository_cfg",
      version: "1.0.0",
      savedAt: new Date().toISOString(),
      source: {
        sourcePath: source.sourcePath || "",
        tableCount: Number(source.tableCount || tables.length || 0),
        taskCount: Number(source.taskCount || rows.length || 0)
      },
      edits: state.cfg.edits || {},
      flags: state.cfg.flags || {},
      codexSuggestions: state.cfg.codexSuggestions || {},
      accepted: state.cfg.accepted || {},
      templateTables: state.cfg.templateTables || {},
      history: state.cfg.history || {},
      reviewQueue: queue,
      reviewGroups: buildReviewGroups(queue),
      templateGuide: buildTemplateGuide()
    };
  }

  function exportBuildCfgSource(){
    var payload = exportPayload();
    delete payload.reviewQueue;
    var json = JSON.stringify({
      kind: payload.kind,
      version: payload.version,
      updatedAt: payload.savedAt,
      source: payload.source,
      edits: payload.edits,
      flags: payload.flags,
      codexSuggestions: payload.codexSuggestions,
      accepted: payload.accepted,
      templateTables: payload.templateTables,
      history: payload.history
    }, null, 2);
    return [
      "/* Packaged task repository review CFG.",
      " * Generated by flippermizer_task_repository.html.",
      " */",
      "(function(global){",
      "  'use strict';",
      "  global.FLPR_TASK_REPOSITORY_DEFAULT_CFG = Object.freeze(" + json + ");",
      "})(typeof window !== 'undefined' ? window : this);",
      ""
    ].join("\n");
  }

  function dateStamp(){
    return new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19);
  }

  function downloadText(filename, text, mimeType){
    var blob = new Blob([text], { type:mimeType || "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 500);
  }

  function buildCodexPrompt(){
    var queue = buildReviewQueue();
    var groups = buildReviewGroups(queue);
    return [
      "Review this Flippermizer task repository queue.",
      "",
      "Flag types:",
      "- full_rewrite: " + FLAG_TYPES.full_rewrite.request,
      "- task_impossible: " + FLAG_TYPES.task_impossible.request,
      "",
      "For task flags, rewrite the task title so it is suitable for the table and aligned with the guide context.",
      "For tooltip flags, rewrite the tooltip as a concise How to Achieve instruction grounded in the guide context.",
      "For impossible tasks, propose a replacement task and explain why the original should not be attempted.",
      "Return JSON grouped by id with title, type, tooltip, replacement_reason, and notes fields where applicable.",
      "If the same task appears in multiple placements for one table, return one grouped suggestion with an ids array so all placements can be updated together.",
      "The repository will import your response as pending Codex suggestions; suggestions are not accepted into builds until the user clicks ACCEPT.",
      "",
      JSON.stringify({
        reviewQueue: queue,
        groupedPlacements: groups
      }, null, 2)
    ].join("\n");

  function copyText(text){
    if(navigator.clipboard && navigator.clipboard.writeText){
      return navigator.clipboard.writeText(text);
    }
    var textarea = document.createElement("textarea");
    textarea.value = text;
    textarea.style.position = "fixed";
    textarea.style.left = "-9999px";
    document.body.appendChild(textarea);
    textarea.focus();
    textarea.select();
    try{ document.execCommand("copy"); }catch(_){}
    textarea.remove();
    return Promise.resolve();
  }

  function suggestionFieldMap(value){
    var raw = value && typeof value === "object" ? value : {};
    var out = {};
    var title = raw.title || raw.task || raw.task_title || raw.rewritten_title || raw.replacement_task || raw.replacementTitle;
    var type = raw.type || raw.task_type || raw.taskType;
    var tooltip = raw.tooltip || raw.how_to || raw.howTo || raw.explanation || raw.rewritten_tooltip || raw.rewrite_tooltip;
    var note = raw.note || raw.notes || raw.replacement_reason || raw.reason || raw.review_note;
    if(typeof title === "string" && title.trim()) out.title = title.trim();
    if(typeof type === "string" && type.trim()) out.type = type.trim();
    if(typeof tooltip === "string" && tooltip.trim()) out.tooltip = tooltip.trim();
    if(typeof note === "string" && note.trim()) out.note = note.trim();
    if(typeof raw.replacement_reason === "string" && raw.replacement_reason.trim()) out.replacement_reason = raw.replacement_reason.trim();
    return out;
  }

  function extractCodexSuggestions(parsed){
    var out = {};
    var stamp = nowIso();
    function add(id, value){
      var cleanId = String(id || "").trim();
      if(!cleanId || !rowsById.has(cleanId)) return;
      var fields = suggestionFieldMap(value);
      if(!Object.keys(fields).some(function(field){ return ["title", "type", "tooltip", "note"].includes(field); })) return;
      out[cleanId] = Object.assign({}, fields, {
        source: "codex",
        updatedAt: String(value && value.updatedAt || stamp)
      });
    }
    function addMany(ids, value){
      if(!Array.isArray(ids)) return;
      ids.forEach(function(id){ add(id, value); });
    }
    function readObject(obj){
      if(!obj || typeof obj !== "object" || Array.isArray(obj)) return;
      Object.keys(obj).forEach(function(key){
        var value = obj[key];
        if(value && typeof value === "object" && Array.isArray(value.ids)) addMany(value.ids, value);
        if(rowsById.has(key)) add(key, value);
      });
    }
    function readArray(arr){
      if(!Array.isArray(arr)) return;
      arr.forEach(function(item){
        if(!item || typeof item !== "object") return;
        if(Array.isArray(item.ids)) addMany(item.ids, item);
        else add(item.id || item.task_id || item.rowId, item);
      });
    }
    if(Array.isArray(parsed)){
      readArray(parsed);
    }else if(parsed && typeof parsed === "object"){
      readObject(parsed);
      readObject(parsed.codexSuggestions);
      readObject(parsed.suggestions);
      readObject(parsed.results);
      readObject(parsed.rewrites);
      readArray(parsed.suggestions);
      readArray(parsed.results);
      readArray(parsed.rewrites);
      readObject(parsed.groups);
      readArray(parsed.groups);
      readObject(parsed.groupedPlacements);
      readArray(parsed.groupedPlacements);
    }
    return out;
  }

  function mergeCodexSuggestions(suggestions){
    var ids = Object.keys(suggestions || {});
    if(!ids.length) return false;
    state.cfg.codexSuggestions = state.cfg.codexSuggestions || {};
    state.cfg.accepted = state.cfg.accepted || {};
    ids.forEach(function(id){
      var suggestion = suggestions[id];
      state.cfg.codexSuggestions[id] = suggestion;
      delete state.cfg.accepted[id];
      var fields = Object.keys(suggestion).filter(function(field){ return ["title", "type", "tooltip", "note"].includes(field); });
      recordHistory(id, "codex", fields, fields.reduce(function(out, field){
        out[field] = suggestion[field];
        return out;
      }, {}));
    });
    scheduleSave();
    return true;
  }

  function rowTaskGroupKey(row){

    return key ? row.tableKey + "|" + key : "";

  function groupRowsForTable(tableKey){
    var grouped = {};
    visibleRowsForTable(tableKey).forEach(function(row){
      var key = rowTaskGroupKey(row);
      if(!key) return;
      (grouped[key] || (grouped[key] = [])).push(row);
    });
    return Object.keys(grouped).map(function(key){
      return { key: key, rows: grouped[key].slice().sort(function(a, b){
        return a.difficultyIndex - b.difficultyIndex || a.index - b.index;
      }) };
    }).filter(function(group){ return group.rows.length > 1; }).sort(function(a, b){
      return a.rows[0].sourceOrder - b.rows[0].sourceOrder;
    });

  function groupIdsAttr(rows){
    return rows.map(function(row){ return row.id; }).join("~~");

  function groupFieldValue(rows, field){

    if(!rows.length) return false;
    var first = editedValue(rows[0], field);
    return rows.some(function(row){ return editedValue(row, field) !== first; });

  function renderRowsForTable(){
    var table = tables.find(function(t){ return t.key === state.selectedTable; });
    if(table){
      els.currentTableTitle.textContent = table.displayName || table.name;
      els.currentTableMeta.textContent = [
        table.code || "",
        table.manufacturer || "",
        table.year || "",

        String((rows.filter(function(row){ return row.tableKey === table.key; }).length)) + " tasks"
      ].filter(Boolean).join(" / ");
    }
    if(state.view === "queue"){
      renderQueueView();
      return;
    }
    if(state.view === "review"){
      renderReviewView();
      return;
    }

      renderGroupView();
      return;
    }
    var visible = visibleRowsForTable(state.selectedTable);
    if(!visible.length){
      els.contentHost.innerHTML = '<div class="emptyState">No entries match the current table filter.</div>';

    var groups = {};

    els.contentHost.innerHTML = DIFFICULTY_ORDER.map(function(difficulty){
      var list = groups[difficulty] || [];
      if(!list.length) return "";
      list.sort(function(a, b){ return a.index - b.index; });

        '<section class="difficultyBlock">',

  function renderQueueView(){
    var queueRows = buildReviewQueue().map(function(item){ return rowsById.get(item.id); }).filter(Boolean);
    if(state.query){
      var q = String(state.query || "").toLowerCase();
      queueRows = queueRows.filter(function(row){ return rowSearchText(row).includes(q); });
    }
    if(state.filter !== "all"){
      queueRows = queueRows.filter(passesFilter);
    }
    queueRows.sort(function(a, b){
      return String(a.tableDisplayName).localeCompare(String(b.tableDisplayName)) ||
        a.difficultyIndex - b.difficultyIndex ||
        a.index - b.index;
    });
    if(!queueRows.length){
      els.contentHost.innerHTML = '<div class="emptyState">No queued flags or edits match the current filter.</div>';
      return;
    }
    els.currentTableTitle.textContent = "Flag Queue";
    els.currentTableMeta.textContent = String(queueRows.length) + " queued entries";
    var current = "";
    var html = "";
    queueRows.forEach(function(row){
      if(row.tableKey !== current){
        if(current) html += '</div></section>';
        current = row.tableKey;
        html += '<section class="difficultyBlock"><div class="difficultyHead"><div class="label">' + escapeHtml(row.tableDisplayName || row.tableName) + '</div><div class="pill">' + escapeHtml(row.tableCode || "") + '</div></div><div class="rows">';
      }
      html += rowCardHtml(row, "tooltips");
    });
    if(current) html += '</div></section>';
    els.contentHost.innerHTML = html;
  }

  function formatWhen(value){
    var raw = String(value || "");
    if(!raw) return "never";
    var date = new Date(raw);
    if(Number.isNaN(date.getTime())) return raw;
    return date.toLocaleString([], { month:"short", day:"numeric", hour:"2-digit", minute:"2-digit" });
  }

  function reviewRows(){
    var query = String(state.query || "").trim().toLowerCase();
    return rows.filter(function(row){
      if(state.view !== "review" && state.selectedTable && row.tableKey !== state.selectedTable) return false;
      var hasReview = rowEdited(row) || rowFlagged(row) || !!suggestionFor(row) || !!acceptedFor(row);
      if(!hasReview) return false;
      if(!passesFilter(row)) return false;
      if(query && !rowSearchText(row).includes(query)) return false;
      return true;
    }).sort(function(a, b){
      return latestReviewMs(b) - latestReviewMs(a) ||
        String(a.tableDisplayName).localeCompare(String(b.tableDisplayName)) ||
        a.difficultyIndex - b.difficultyIndex ||
        a.index - b.index;
    });
  }

  function latestReviewMs(row){
    var edit = state.cfg.edits && state.cfg.edits[row.id] || {};
    var suggestion = suggestionFor(row) || {};
    var accepted = acceptedFor(row) || {};
    return Math.max(
      Date.parse(edit.updatedAt || "") || 0,
      Date.parse(suggestion.updatedAt || "") || 0,
      Date.parse(accepted.updatedAt || "") || 0
    );
  }

  function latestSourceLabel(row){
    var edit = state.cfg.edits && state.cfg.edits[row.id] || {};
    var suggestion = suggestionFor(row) || {};
    var accepted = acceptedFor(row) || {};
    var manualMs = Date.parse(edit.updatedAt || "") || 0;
    var codexMs = Date.parse(suggestion.updatedAt || "") || 0;
    var acceptedMs = Date.parse(accepted.updatedAt || "") || 0;
    if(acceptedMs >= manualMs && acceptedMs >= codexMs && acceptedMs > 0) return "accepted last";
    if(codexMs >= manualMs && codexMs > 0) return "codex last";
    if(manualMs > 0) return "manual last";
    return "not updated";
  }

  function reviewTextBlock(label, value){
    var clean = String(value == null ? "" : value).trim();
    return [
      '<h3>' + escapeHtml(label) + '</h3>',
      '<div class="reviewText' + (clean ? "" : " empty") + '">' + escapeHtml(clean || "No value.") + '</div>'
    ].join("");
  }

  function reviewCardHtml(row){
    var edit = state.cfg.edits && state.cfg.edits[row.id] || {};
    var suggestion = suggestionFor(row) || {};
    var accepted = acceptedFor(row) || null;
    var flags = state.cfg.flags && state.cfg.flags[row.id] || {};
    var classes = ["reviewCard"];
    if(hasPendingCodex(row)) classes.push("pendingCodex");
    if(accepted) classes.push("accepted");
    var codexTitle = hasOwn(suggestion, "title") ? suggestion.title : "";
    var codexTooltip = hasOwn(suggestion, "tooltip") ? suggestion.tooltip : "";
    var codexNote = String(suggestion.note || suggestion.notes || suggestion.replacement_reason || "").trim();
    var currentText = [
      "Task: " + editedValue(row, "title"),
      "Type: " + editedValue(row, "type"),
      "Tooltip: " + editedValue(row, "tooltip"),
      editedValue(row, "note") ? "Note: " + editedValue(row, "note") : ""
    ].filter(Boolean).join("\n\n");
    var codexText = [
      codexTitle ? "Task: " + codexTitle : "",
      suggestion.type ? "Type: " + suggestion.type : "",
      codexTooltip ? "Tooltip: " + codexTooltip : "",
      codexNote ? "Note: " + codexNote : ""
    ].filter(Boolean).join("\n\n");
    var originalText = [
      "Task: " + row.originalTitle,
      "Type: " + row.originalType,
      "Tooltip: " + originalField(row, "tooltip")
    ].join("\n\n");
    return [
      '<article class="' + classes.join(" ") + '" data-row="' + escapeAttr(row.id) + '">',
      '<div class="reviewHead">',
      '<div>',
      '<div class="reviewTitle">' + escapeHtml(row.tableDisplayName || row.tableName) + ' - ' + escapeHtml(row.originalTitle) + '</div>',
      '<div class="reviewMeta">',
      '<span class="badge green">' + escapeHtml(row.difficulty) + '</span>',
      '<span class="badge">' + escapeHtml(latestSourceLabel(row)) + '</span>',
      '<span class="badge violet">manual: ' + escapeHtml(formatWhen(edit.updatedAt)) + '</span>',
      '<span class="badge gold">codex: ' + escapeHtml(formatWhen(suggestion.updatedAt)) + '</span>',
      accepted ? '<span class="badge green">accepted: ' + escapeHtml(formatWhen(accepted.updatedAt)) + ' / ' + escapeHtml(accepted.source || "current") + '</span>' : "",
      flags.task ? '<span class="badge gold">task: ' + escapeHtml(FLAG_TYPES[flags.task]?.label || flags.task) + '</span>' : "",
      flags.tooltip ? '<span class="badge gold">tooltip: ' + escapeHtml(FLAG_TYPES[flags.tooltip]?.label || flags.tooltip) + '</span>' : "",
      '</div>',
      '</div>',
      '<div class="pill">' + escapeHtml(row.tableCode || row.originalType) + '</div>',
      '</div>',
      '<div class="reviewCols">',
      '<div class="reviewCol">' + reviewTextBlock("ORIGINAL", originalText) + '</div>',
      '<div class="reviewCol">' + reviewTextBlock("CURRENT MANUAL / ACCEPTED", currentText) + '</div>',
      '</div>',
      '<div class="reviewCols" style="margin-top:10px;">',
      '<div class="reviewCol">' + reviewTextBlock("CODEX SUGGESTION", codexText) + '</div>',
      '<div class="reviewCol">' + reviewTextBlock("GUIDE CONTEXT", guideMetaFor(row).text || "No guide context resolved.") + '</div>',
      '</div>',
      '<div class="reviewActions">',
      hasPendingCodex(row) ? '<button class="miniAction green" type="button" data-action="accept-codex" data-id="' + escapeAttr(row.id) + '">ACCEPT CODEX</button>' : "",
      rowEdited(row) ? '<button class="miniAction green" type="button" data-action="accept-current" data-id="' + escapeAttr(row.id) + '">ACCEPT CURRENT</button>' : "",
      '<button class="miniAction gold" type="button" data-action="flag-again" data-flag="full_rewrite" data-id="' + escapeAttr(row.id) + '">FLAG FULL REWRITE</button>',
      '<button class="miniAction red" type="button" data-action="flag-again" data-flag="task_impossible" data-id="' + escapeAttr(row.id) + '">FLAG IMPOSSIBLE</button>',
      '</div>',
      '</article>'
    ].join("");
  }

  function renderReviewView(){
    var list = reviewRows();
    els.currentTableTitle.textContent = "Review Changes";
    els.currentTableMeta.textContent = "Manual edits, pending Codex suggestions, accepted rewrites, and repeat flags.";
    if(!list.length){
      els.contentHost.innerHTML = '<div class="emptyState">No manual updates, Codex suggestions, or accepted rewrites match the current filter.</div>';
      return;
    }
    els.contentHost.innerHTML = '<div class="reviewStack">' + list.map(reviewCardHtml).join("") + '</div>';
  }

  function renderQueueAside(){
    var queue = buildReviewQueue();
    els.queueCountPill.textContent = String(queue.length);
    if(!queue.length){
      els.queueList.innerHTML = '<div class="emptyState">No flags yet.</div>';
      return;
    }
    els.queueList.innerHTML = queue.slice(0, 80).map(function(item){
      var flagBits = [];
      if(item.flags.task) flagBits.push("task: " + FLAG_TYPES[item.flags.task].label);
      if(item.flags.tooltip) flagBits.push("tooltip: " + FLAG_TYPES[item.flags.tooltip].label);
      var note = item.edited.note ? item.edited.note : item.original.guideTooltip;
      return [
        '<div class="queueItem">',
        '<div class="qTitle">' + escapeHtml(item.table) + ' - ' + escapeHtml(item.edited.title || item.original.title) + '</div>',
        '<div class="qMeta">' + escapeHtml(item.difficulty) + ' / ' + escapeHtml(flagBits.join(" / ") || "edited") + '</div>',
        '<div class="queuePreview">' + escapeHtml(note || "No note.") + '</div>',
        '</div>'
      ].join("");
    }).join("");
  }

  function renderTabs(){
    document.querySelectorAll("[data-view]").forEach(function(btn){
      btn.classList.toggle("active", btn.getAttribute("data-view") === state.view);
    });
  }

  function renderTemplateToggle(){
    if(!els.templateToggleBtn) return;
    var marked = isTemplateTable(state.selectedTable);
    els.templateToggleBtn.textContent = marked ? "TEMPLATE TABLE" : "MARK TEMPLATE";
    els.templateToggleBtn.classList.toggle("templateOn", marked);
  }

  function renderAll(){
    renderStats();
    renderTables();
    renderTabs();
    renderTemplateToggle();
    renderRowsForTable();
    renderQueueAside();
  }

  function importCfgFile(file){
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var parsed = JSON.parse(String(reader.result || ""));
        var suggestions = extractCodexSuggestions(parsed);
        if(Object.keys(suggestions).length){
          mergeCodexSuggestions(suggestions);
          els.saveStatus.textContent = "CODEX IMPORTED";
          renderAll();
          showToast("Codex suggestions imported.");
          return;
        }
        state.cfg = mergeCfg(state.cfg, normalizeCfg(parsed));
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.cfg));
        els.saveStatus.textContent = "CFG IMPORTED";
        renderAll();
        showToast("CFG imported.");
      }catch(_){
        showToast("Import failed.");
      }
    };
    reader.readAsText(file);
  }

  document.addEventListener("click", function(event){
    var tableBtn = event.target.closest("[data-table]");
    if(tableBtn){
      state.selectedTable = tableBtn.getAttribute("data-table") || state.selectedTable;
      state.view = state.view === "queue" ? "tasks" : state.view;
      renderAll();
      return;
    }
    var viewBtn = event.target.closest("[data-view]");
    if(viewBtn){
      state.view = viewBtn.getAttribute("data-view") || "tasks";
      renderAll();
      return;
    }
    var actionBtn = event.target.closest("[data-action]");
    if(actionBtn && actionBtn.getAttribute("data-action") === "toggle-template"){
      toggleTemplateTable(state.selectedTable);
      renderAll();
      showToast(isTemplateTable(state.selectedTable) ? "Template table marked." : "Template table unmarked.");
      return;
    }
    if(actionBtn && actionBtn.getAttribute("data-action") === "accept-codex"){
      acceptSuggestion(actionBtn.getAttribute("data-id"));
      renderAll();
      showToast("Codex suggestion accepted.");
      return;
    }
    if(actionBtn && actionBtn.getAttribute("data-action") === "accept-current"){
      acceptCurrent(actionBtn.getAttribute("data-id"));
      renderAll();
      showToast("Current edit accepted.");
      return;
    }
    if(actionBtn && actionBtn.getAttribute("data-action") === "flag-again"){
      var id = actionBtn.getAttribute("data-id");
      var flag = actionBtn.getAttribute("data-flag") || "full_rewrite";
      setFlag(id, "task", flag);
      setFlag(id, "tooltip", flag === "task_impossible" ? "" : "full_rewrite");
      renderAll();
      showToast("Flagged for another pass.");
      return;
    }
    if(event.target.id === "exportCfgBtn"){
      downloadText("flippermizer_task_repository_" + dateStamp() + ".cfg.json", JSON.stringify(exportPayload(), null, 2));
      showToast("CFG saved.");
      return;
    }
    if(event.target.id === "exportBuildCfgBtn"){
      downloadText("flippermizer_task_repository_cfg.js", exportBuildCfgSource(), "text/javascript");
      showToast("Build CFG saved.");
      return;
    }
    if(event.target.id === "copyQueueBtn"){
      copyText(buildCodexPrompt()).then(function(){ showToast("Codex queue copied."); }, function(){ showToast("Copy failed."); });
      return;
    }
    if(event.target.id === "copyTemplateGuideBtn"){
      copyText(JSON.stringify(buildTemplateGuide(), null, 2)).then(function(){ showToast("Template guide copied."); }, function(){ showToast("Copy failed."); });
      return;
    }
    if(event.target.id === "importCfgBtn"){
      els.cfgFileInput.click();
      return;
    }
    if(event.target.id === "resetCfgBtn"){
      if(!window.confirm("Reset local task repository edits and flags?")) return;
      state.cfg = emptyCfg();
      localStorage.removeItem(STORAGE_KEY);
      els.saveStatus.textContent = "LOCAL RESET";
      renderAll();
      showToast("Local cfg reset.");
    }
  });

  document.addEventListener("input", function(event){
    var target = event.target;
    if(target.id === "searchInput"){
      state.query = target.value || "";
      renderAll();
      return;
    }
    if(target && target.getAttribute("data-action") === "edit"){
      setEditField(target.getAttribute("data-id"), target.getAttribute("data-field"), target.value);
      return;
    }
    if(target && target.getAttribute("data-action") === "group-edit"){
      setEditFieldGroup(target.getAttribute("data-ids"), target.getAttribute("data-field"), target.value);
    }
  });

  document.addEventListener("change", function(event){
    var target = event.target;
    if(target.id === "filterSelect"){
      state.filter = target.value || "all";
      renderAll();
      return;
    }
    if(target.id === "tableSortSelect"){
      state.sort = target.value || "name";
      renderAll();
      return;
    }
    if(target.id === "cfgFileInput"){
      importCfgFile(target.files && target.files[0]);
      target.value = "";
      return;
    }
    if(target && target.getAttribute("data-action") === "flag"){
      setFlag(target.getAttribute("data-id"), target.getAttribute("data-target"), target.value);
      renderAll();
      return;
    }
    if(target && target.getAttribute("data-action") === "group-flag"){
      setFlagGroup(target.getAttribute("data-ids"), target.getAttribute("data-target"), target.value);
      renderAll();
      return;
    }
    if(target && target.getAttribute("data-action") === "edit"){
      setEditField(target.getAttribute("data-id"), target.getAttribute("data-field"), target.value);
      return;
    }
    if(target && target.getAttribute("data-action") === "group-edit"){
      setEditFieldGroup(target.getAttribute("data-ids"), target.getAttribute("data-field"), target.value);
    }
  });

  buildRows();
  els.sourceSummary.textContent = [
    String(source.tableCount || tables.length || 0) + " tables",
    String(source.taskCount || rows.length || 0) + " task entries",
    source.sourcePath || "embedded task source"
  ].join(" / ");
  state.selectedTable = state.selectedTable || (sortTables(tables)[0] && sortTables(tables)[0].key) || "";
  renderAll();
})();
</script>
</body>
</html>
