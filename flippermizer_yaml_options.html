<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flippermizer YAML Options</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#04121f;
  --bg2:#02070d;
  --panel:#07121f;
  --panel2:#06101b;
  --cyan:#00d9ff;
  --cyan2:#00a6ff;
  --green:#22ff88;
  --gold:#ffd66f;
  --danger:#ff4d6d;
  --text:#e8faff;
  --muted:#9bb9c4;
  --line:rgba(0,217,255,.36);
  --lineSoft:rgba(0,217,255,.16);
  --shadow:rgba(0,0,0,.42);
  --mono:'Press Start 2P', monospace;
  --ui:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --flprScrollbarTrack:rgba(0,18,31,.96);
  --flprScrollbarTrackEdge:rgba(0,217,255,.18);
  --flprScrollbarThumbTop:rgba(132,248,255,.96);
  --flprScrollbarThumbMid:rgba(0,166,255,.92);
  --flprScrollbarThumbBottom:rgba(0,255,213,.78);
  --flprScrollbarThumbBorder:rgba(150,248,255,.72);
  --flprScrollbarThumbGlow:rgba(0,217,255,.42);
}

*{box-sizing:border-box}

html,
body{
  min-height:100%;
  margin:0;
  background:
    linear-gradient(rgba(0,217,255,.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,217,255,.04) 1px, transparent 1px),
    radial-gradient(900px 420px at 18% 0%, rgba(0,217,255,.14), transparent 65%),
    radial-gradient(760px 360px at 100% 12%, rgba(34,255,136,.10), transparent 60%),
    linear-gradient(180deg,var(--bg1),var(--bg2));
  background-size:24px 24px,24px 24px,auto,auto,auto;
  color:var(--text);
  font-family:var(--ui);
}

body{
  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  background:repeating-linear-gradient(180deg, rgba(255,255,255,.035) 0 1px, transparent 1px 4px);
  opacity:.18;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

button:disabled{
  cursor:not-allowed;
}

::selection{
  background:rgba(34,255,136,.3);
  color:#fff;
}

::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-track{
  background:linear-gradient(180deg,var(--flprScrollbarTrack),rgba(2,7,13,.92));
  border:1px solid var(--flprScrollbarTrackEdge);
}
::-webkit-scrollbar-thumb{
  background:linear-gradient(180deg,var(--flprScrollbarThumbTop),var(--flprScrollbarThumbMid) 46%,var(--flprScrollbarThumbBottom));
  border:2px solid rgba(0,18,31,.94);
  box-shadow:0 0 12px var(--flprScrollbarThumbGlow);
}

.app{
  position:relative;
  z-index:1;
  width:min(1780px, calc(100vw - 32px));
  margin:0 auto;
  padding:18px 0 22px;
}

.toolHeader{
  min-height:92px;
  display:grid;
  grid-template-columns:auto minmax(0, 1fr) auto;
  gap:18px;
  align-items:center;
  border:3px solid var(--line);
  border-radius:8px;
  padding:16px 18px;
  background:
    linear-gradient(90deg, rgba(0,217,255,.14), transparent 42%),
    linear-gradient(180deg, rgba(7,18,31,.96), rgba(3,8,14,.96));
  box-shadow:0 10px 24px var(--shadow), inset 0 0 28px rgba(0,217,255,.08);
}

.brandMark{
  width:58px;
  height:58px;
  border:2px solid rgba(34,255,136,.7);
  border-radius:8px;
  display:grid;
  place-items:center;
  background:rgba(0,0,0,.28);
  box-shadow:0 0 18px rgba(34,255,136,.16);
}

.brandMark img{
  width:42px;
  height:42px;
  object-fit:contain;
  image-rendering:auto;
}

.eyebrow,
.panelKicker,
.statusLabel,
.countBadge,
.miniButton,
.arcadeButton,
.tabButton,
.groupCode,
.fieldName,
.chipLabel{
  font-family:var(--mono);
}

.eyebrow{
  margin-bottom:9px;
  color:var(--green);
  font-size:10px;
  letter-spacing:0;
}

h1{
  margin:0;
  color:var(--cyan);
  font-family:var(--mono);
  font-size:24px;
  line-height:1.25;
  letter-spacing:0;
  text-shadow:0 0 14px rgba(0,217,255,.34);
}

.headerMeta{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  justify-content:flex-end;
  align-items:center;
}

.statusPill{
  min-width:210px;
  border:2px solid rgba(34,255,136,.56);
  border-radius:8px;
  padding:10px 12px;
  background:rgba(0,0,0,.28);
  box-shadow:inset 0 0 16px rgba(34,255,136,.08);
}

.statusLabel{
  color:var(--green);
  font-size:9px;
  line-height:1.35;
}

.statusValue{
  margin-top:6px;
  color:var(--text);
  font-size:12px;
  line-height:1.35;
}

.workspace{
  display:grid;
  grid-template-columns:minmax(420px, 1fr) minmax(360px, .85fr) minmax(460px, 1fr);
  gap:14px;
  align-items:start;
  margin-top:14px;
}

.panel{
  min-width:0;
  border:3px solid var(--line);
  border-radius:8px;
  background:
    linear-gradient(180deg, rgba(9,24,39,.96), rgba(3,9,16,.98));
  box-shadow:0 10px 24px var(--shadow), inset 0 0 24px rgba(0,217,255,.06);
  overflow:hidden;
}

.panelHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  min-height:52px;
  padding:13px 14px 12px;
  border-bottom:2px solid var(--lineSoft);
  background:linear-gradient(90deg, rgba(0,217,255,.14), rgba(34,255,136,.07), transparent);
}

.panelTitle{
  margin:0;
  color:var(--cyan);
  font-family:var(--mono);
  font-size:12px;
  line-height:1.35;
  letter-spacing:0;
}

.panelKicker{
  color:var(--muted);
  font-size:8px;
  line-height:1.35;
}

.panelBody{
  padding:14px;
}

.builderPanel .panelBody,
.catalogPanel .panelBody{
  max-height:calc(100vh - 192px);
  min-height:520px;
  overflow:auto;
}

.fieldGrid{
  display:grid;
  grid-template-columns:repeat(2, minmax(0, 1fr));
  gap:10px;
}

.field{
  display:grid;
  gap:8px;
  min-width:0;
}

.field.full{
  grid-column:1 / -1;
}

.fieldName{
  color:var(--green);
  font-size:9px;
  line-height:1.35;
}

.fieldHint,
.optionDesc,
.validationLine{
  color:var(--muted);
  font-size:12px;
  line-height:1.42;
}

.textInput,
.selectInput,
.yamlOutput,
.curatedInput{
  width:100%;
  min-width:0;
  border:2px solid rgba(0,166,255,.56);
  border-radius:6px;
  background:rgba(0,0,0,.32);
  color:var(--text);
  outline:none;
  box-shadow:inset 0 0 16px rgba(0,0,0,.28);
}

.textInput,
.selectInput{
  height:42px;
  padding:9px 10px;
}

.selectInput{
  appearance:none;
  background:
    linear-gradient(45deg, transparent 50%, var(--cyan) 50%) calc(100% - 18px) 17px / 7px 7px no-repeat,
    linear-gradient(135deg, var(--cyan) 50%, transparent 50%) calc(100% - 13px) 17px / 7px 7px no-repeat,
    rgba(0,0,0,.32);
}

.textInput:focus,
.selectInput:focus,
.yamlOutput:focus,
.curatedInput:focus{
  border-color:var(--green);
  box-shadow:0 0 0 2px rgba(34,255,136,.14), inset 0 0 16px rgba(0,0,0,.28);
}

.presetBar,
.buttonRow{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.presetBar{
  margin:12px 0 14px;
}

.arcadeButton,
.miniButton,
.iconButton{
  border:2px solid rgba(0,217,255,.62);
  border-radius:6px;
  background:
    linear-gradient(180deg, rgba(0,166,255,.18), rgba(0,0,0,.22));
  color:var(--text);
  box-shadow:inset 0 0 14px rgba(0,217,255,.08), 0 4px 12px rgba(0,0,0,.22);
  transition:transform .12s ease, border-color .12s ease, color .12s ease, filter .12s ease;
}

.arcadeButton{
  min-height:42px;
  padding:10px 12px;
  font-size:9px;
  line-height:1.35;
}

.miniButton,
.iconButton{
  min-height:30px;
  padding:7px 9px;
  font-size:8px;
  line-height:1.2;
}

.iconButton{
  width:34px;
  padding:0;
  display:grid;
  place-items:center;
}

.arcadeButton:hover,
.miniButton:hover,
.iconButton:hover{
  border-color:var(--green);
  color:var(--green);
  transform:translateY(-1px);
  filter:brightness(1.08);
}

.arcadeButton.primary,
.miniButton.primary{
  border-color:rgba(34,255,136,.82);
  background:linear-gradient(180deg, rgba(34,255,136,.22), rgba(0,0,0,.2));
}

.arcadeButton.gold,
.miniButton.gold{
  border-color:rgba(255,214,111,.7);
  color:var(--gold);
}

.arcadeButton.danger,
.miniButton.danger,
.iconButton.danger{
  border-color:rgba(255,77,109,.72);
  color:#ffb6c4;
}

.optionGroup{
  border-top:2px solid var(--lineSoft);
  padding-top:14px;
  margin-top:14px;
}

.optionGroup:first-of-type{
  border-top:0;
  padding-top:0;
  margin-top:0;
}

.optionGroupTitle{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin:0 0 10px;
}

.optionGroupTitle h3{
  margin:0;
  color:var(--cyan);
  font-family:var(--mono);
  font-size:11px;
  line-height:1.35;
}

.optionList{
  display:grid;
  gap:10px;
}

.optionRow{
  display:grid;
  grid-template-columns:minmax(0, 1fr);
  gap:10px;
  border:2px solid rgba(0,217,255,.18);
  border-radius:8px;
  padding:11px;
  background:rgba(0,0,0,.18);
}

.optionTop{
  display:grid;
  grid-template-columns:minmax(0, 1fr) minmax(190px, 260px);
  gap:12px;
  align-items:center;
}

.optionTitle{
  margin:0 0 6px;
  color:var(--text);
  font-family:var(--mono);
  font-size:10px;
  line-height:1.35;
}

.optionDesc{
  margin:0;
}

.toggleBox{
  position:relative;
  display:inline-flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  width:128px;
  min-height:38px;
  justify-self:end;
  padding:6px 8px;
  border:2px solid rgba(0,166,255,.62);
  border-radius:6px;
  background:rgba(0,0,0,.28);
  color:var(--muted);
  font-family:var(--mono);
  font-size:8px;
  user-select:none;
}

.toggleBox input{
  position:absolute;
  opacity:0;
  pointer-events:none;
}

.toggleRail{
  width:42px;
  height:20px;
  border:2px solid rgba(0,217,255,.55);
  border-radius:4px;
  background:rgba(0,0,0,.35);
  display:block;
  position:relative;
}

.toggleRail::after{
  content:"";
  position:absolute;
  width:12px;
  height:12px;
  left:2px;
  top:2px;
  border-radius:2px;
  background:var(--muted);
  transition:transform .14s ease, background .14s ease, box-shadow .14s ease;
}

.toggleBox input:checked + .toggleRail{
  border-color:rgba(34,255,136,.85);
}

.toggleBox input:checked + .toggleRail::after{
  transform:translateX(20px);
  background:var(--green);
  box-shadow:0 0 10px rgba(34,255,136,.5);
}

.toggleText::before{
  content:"OFF";
}

.toggleBox:has(input:checked){
  color:var(--green);
  border-color:rgba(34,255,136,.82);
}

.toggleBox:has(input:checked) .toggleText::before{
  content:"ON";
}

.rangeWrap{
  display:grid;
  grid-template-columns:minmax(0, 1fr) 72px;
  gap:8px;
  align-items:center;
}

.rangeWrap input[type="range"]{
  width:100%;
  accent-color:var(--green);
}

.rangeNumber{
  width:72px;
  height:38px;
  border:2px solid rgba(0,166,255,.56);
  border-radius:6px;
  background:rgba(0,0,0,.32);
  color:var(--text);
  text-align:center;
}

.segmented{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(86px, 1fr));
  gap:6px;
}

.segButton{
  min-height:36px;
  border:2px solid rgba(0,166,255,.48);
  border-radius:6px;
  background:rgba(0,0,0,.22);
  color:var(--muted);
  font-family:var(--mono);
  font-size:8px;
  line-height:1.35;
  padding:7px 8px;
}

.segButton.active{
  border-color:rgba(34,255,136,.86);
  color:var(--green);
  background:rgba(34,255,136,.12);
  box-shadow:0 0 14px rgba(34,255,136,.12);
}

.curatedInput{
  min-height:82px;
  resize:vertical;
  padding:10px;
  line-height:1.45;
}

.catalogTools{
  display:grid;
  gap:10px;
}

.countGrid{
  display:grid;
  grid-template-columns:repeat(3, minmax(0, 1fr));
  gap:8px;
}

.countBadge{
  min-height:50px;
  border:2px solid rgba(0,217,255,.22);
  border-radius:8px;
  padding:9px;
  background:rgba(0,0,0,.2);
  font-size:8px;
  line-height:1.35;
  color:var(--muted);
}

.countBadge strong{
  display:block;
  margin-top:5px;
  color:var(--text);
  font-size:12px;
}

.selectedList{
  display:grid;
  gap:8px;
  margin:12px 0;
}

.selectedChip{
  display:grid;
  grid-template-columns:minmax(0, 1fr) auto auto auto;
  gap:6px;
  align-items:center;
  min-height:42px;
  border:2px solid rgba(34,255,136,.32);
  border-radius:8px;
  padding:7px;
  background:rgba(34,255,136,.08);
}

.chipLabel{
  min-width:0;
  color:var(--text);
  font-size:9px;
  line-height:1.35;
}

.chipKey{
  margin-top:3px;
  color:var(--muted);
  font-family:var(--ui);
  font-size:12px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.catalogGrid{
  display:grid;
  grid-template-columns:repeat(2, minmax(0, 1fr));
  gap:10px;
  margin-top:12px;
}

.groupButton{
  position:relative;
  min-height:112px;
  border:2px solid rgba(0,217,255,.3);
  border-radius:8px;
  overflow:hidden;
  padding:0;
  color:var(--text);
  text-align:left;
  background:#04111e;
  box-shadow:0 6px 18px rgba(0,0,0,.24);
}

.groupButton::before{
  content:"";
  position:absolute;
  inset:0;
  background-image:linear-gradient(180deg, rgba(0,0,0,.20), rgba(0,0,0,.82)), var(--group-image);
  background-size:cover;
  background-position:center;
  filter:saturate(1.06) contrast(1.03);
  transition:transform .18s ease, filter .18s ease;
}

.groupButton::after{
  content:"";
  position:absolute;
  inset:0;
  border:1px solid rgba(255,255,255,.08);
  pointer-events:none;
}

.groupButton:hover{
  border-color:var(--green);
}

.groupButton:hover::before{
  transform:scale(1.035);
  filter:saturate(1.18) contrast(1.08) brightness(1.06);
}

.groupButton.selected{
  border-color:rgba(34,255,136,.92);
  box-shadow:0 0 18px rgba(34,255,136,.18), 0 6px 18px rgba(0,0,0,.24);
}

.groupButton.notReady{
  opacity:.58;
  filter:saturate(.65);
}

.groupButton.notReady:hover{
  border-color:rgba(255,214,111,.72);
}

.groupButtonInner{
  position:relative;
  z-index:1;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  min-height:112px;
  padding:10px;
}

.groupCode{
  margin-bottom:5px;
  color:var(--cyan);
  font-size:8px;
  line-height:1.25;
}

.groupName{
  color:#fff;
  font-weight:800;
  line-height:1.15;
  text-shadow:0 2px 12px rgba(0,0,0,.8);
}

.groupTables{
  margin-top:6px;
  color:#d7eef5;
  font-size:11px;
  line-height:1.25;
}

.previewPanel{
  position:sticky;
  top:14px;
}

.yamlOutput{
  min-height:550px;
  resize:vertical;
  padding:14px;
  font-family:Consolas, "Courier New", monospace;
  font-size:13px;
  line-height:1.45;
  white-space:pre;
}

.validationBox{
  display:grid;
  gap:6px;
  min-height:92px;
  margin-top:12px;
  border:2px solid rgba(0,217,255,.18);
  border-radius:8px;
  padding:10px;
  background:rgba(0,0,0,.18);
}

.validationLine.good{color:var(--green)}
.validationLine.warn{color:var(--gold)}
.validationLine.bad{color:#ff9daf}

@media (max-width:1380px){
  .workspace{
    grid-template-columns:1fr 1fr;
  }
  .previewPanel{
    position:static;
    grid-column:1 / -1;
  }
}

@media (max-width:900px){
  .app{
    width:min(100vw - 20px, 760px);
    padding-top:10px;
  }
  .toolHeader{
    grid-template-columns:1fr;
  }
  .headerMeta{
    justify-content:flex-start;
  }
  .workspace,
  .fieldGrid,
  .optionTop,
  .catalogGrid,
  .countGrid{
    grid-template-columns:1fr;
  }
  h1{
    font-size:18px;
  }
  .builderPanel .panelBody,
  .catalogPanel .panelBody{
    max-height:none;
    min-height:0;
  }
  .toggleBox{
    justify-self:start;
  }
}
</style>
</head>
<body>
<div class="app">
  <header class="toolHeader">
    <div class="brandMark" aria-hidden="true">
      <img src="Flippermizer Images/FM-Icon64x64.png" alt="">
    </div>
    <div>
      <div class="eyebrow">AP YAML BUILDER</div>
      <h1>FLIPPERMIZER OPTIONS</h1>
    </div>
    <div class="headerMeta">
      <div class="statusPill">
        <div class="statusLabel">WORLD</div>
        <div class="statusValue" id="worldStatus">Flippermizer</div>
      </div>
      <div class="statusPill">
        <div class="statusLabel">YAML STATE</div>
        <div class="statusValue" id="yamlStatus">READY</div>
      </div>
    </div>
  </header>

  <main class="workspace">
    <section class="panel builderPanel" aria-labelledby="builderTitle">
      <div class="panelHeader">
        <div>
          <h2 class="panelTitle" id="builderTitle">PLAYER + OPTIONS</h2>
          <div class="panelKicker">CURRENT MANUAL AP WORLD CONFIG</div>
        </div>
      </div>
      <div class="panelBody">
        <div class="fieldGrid">
          <label class="field">
            <span class="fieldName">PLAYER NAME</span>
            <input class="textInput" id="playerName" autocomplete="off" spellcheck="false">
          </label>
          <label class="field">
            <span class="fieldName">GAME KEY</span>
            <input class="textInput" id="gameKey" autocomplete="off" spellcheck="false">
          </label>
          <label class="field full">
            <span class="fieldName">DESCRIPTION</span>
            <input class="textInput" id="description" autocomplete="off" spellcheck="false">
          </label>
        </div>

        <div class="presetBar" role="group" aria-label="Preset YAML states">
          <button class="arcadeButton primary" type="button" data-preset="noTrap">NO-TRAP TEST</button>
          <button class="arcadeButton gold" type="button" data-preset="episode">EPISODE TRAPS</button>
          <button class="arcadeButton" type="button" data-preset="defaults">AP DEFAULTS</button>
        </div>

        <div id="optionMount"></div>
      </div>
    </section>

    <section class="panel catalogPanel" aria-labelledby="catalogTitle">
      <div class="panelHeader">
        <div>
          <h2 class="panelTitle" id="catalogTitle">WORLD GROUPS</h2>
          <div class="panelKicker">BASE GAME CATALOG</div>
        </div>
      </div>
      <div class="panelBody">
        <div class="catalogTools">
          <div class="countGrid">
            <div class="countBadge">SELECTED<strong id="selectedCount">0</strong></div>
            <div class="countBadge">REQUESTED<strong id="requestedCount">0</strong></div>
            <div class="countBadge">TABLES<strong id="tableCount">0</strong></div>
          </div>
          <div class="buttonRow">
            <button class="miniButton primary" type="button" id="matchCountBtn">MATCH COUNT</button>
            <button class="miniButton gold" type="button" id="shuffleGroupsBtn">SHUFFLE ORDER</button>
            <button class="miniButton danger" type="button" id="clearGroupsBtn">CLEAR</button>
          </div>
        </div>

        <div class="selectedList" id="selectedGroups"></div>
        <div class="catalogGrid" id="catalogGrid"></div>
      </div>
    </section>

    <section class="panel previewPanel" aria-labelledby="previewTitle">
      <div class="panelHeader">
        <div>
          <h2 class="panelTitle" id="previewTitle">YAML OUTPUT</h2>
          <div class="panelKicker">COPY OR EXPORT PLAYER FILE</div>
        </div>
        <div class="buttonRow">
          <button class="arcadeButton primary" type="button" id="copyBtn">COPY YAML</button>
          <button class="arcadeButton gold" type="button" id="downloadBtn">DOWNLOAD</button>
        </div>

    values:Object.fromEntries(OPTION_DEFS.map((def) => [def.key, def.defaultValue]))

};

const els = {};
const valueInputs = new Map();

function init(){
  [
    "playerName","gameKey","description","optionMount","catalogGrid","selectedGroups",
    "selectedCount","requestedCount","tableCount","yamlOutput","validationBox",
    "copyBtn","downloadBtn","matchCountBtn","shuffleGroupsBtn","clearGroupsBtn",
    "yamlStatus","worldStatus"
  ].forEach((id) => els[id] = document.getElementById(id));

  els.gameKey.value = GAME_KEY;
  els.worldStatus.textContent = GAME_KEY;
  renderOptions();
  renderCatalog();
  bindGlobalControls();
  applyPreset("noTrap");
}

function renderOptions(){
  els.optionMount.innerHTML = "";
  for(const groupName of GROUP_ORDER){
    const defs = OPTION_DEFS.filter((def) => def.group === groupName);
    if(!defs.length) continue;
    const group = document.createElement("section");
    group.className = "optionGroup";
    group.innerHTML = `
      <div class="optionGroupTitle">
        <h3>${escapeHtml(groupName)}</h3>
        <span class="panelKicker">${defs.length} OPTION${defs.length === 1 ? "" : "S"}</span>
      </div>
      <div class="optionList"></div>
    `;
    const list = group.querySelector(".optionList");
    defs.forEach((def) => list.appendChild(renderOptionRow(def)));
    els.optionMount.appendChild(group);
  }
}

function renderOptionRow(def){
  const row = document.createElement("div");
  row.className = "optionRow";
  const control = renderControl(def);
  const controlWrap = document.createElement("div");
  controlWrap.appendChild(control);
  row.innerHTML = `
    <div class="optionTop">
      <div>
        <h4 class="optionTitle">${escapeHtml(def.label)}</h4>
        <p class="optionDesc">${escapeHtml(def.description)}</p>
      </div>
    </div>
  `;
  row.querySelector(".optionTop").appendChild(controlWrap);
  return row;
}

function renderControl(def){
  if(def.type === "toggle"){
    const label = document.createElement("label");
    label.className = "toggleBox";
    label.innerHTML = `
      <input type="checkbox" data-option="${escapeAttr(def.key)}">
      <span class="toggleRail" aria-hidden="true"></span>
      <span class="toggleText"></span>
    `;
    const input = label.querySelector("input");
    input.addEventListener("change", updateAll);
    valueInputs.set(def.key, input);
    return label;
  }

  if(def.type === "range"){
    const wrap = document.createElement("div");
    wrap.className = "rangeWrap";
    wrap.innerHTML = `
      <input type="range" data-option="${escapeAttr(def.key)}" min="${def.min}" max="${def.max}" step="${def.step || 1}">
      <input class="rangeNumber" type="number" min="${def.min}" max="${def.max}" step="${def.step || 1}" aria-label="${escapeAttr(def.label)} value">
    `;
    const range = wrap.querySelector('input[type="range"]');
    const number = wrap.querySelector('input[type="number"]');
    range.addEventListener("input", () => {
      number.value = range.value;
      updateAll();
    });
    number.addEventListener("input", () => {
      const value = clamp(Number(number.value || def.min), def.min, def.max);
      range.value = String(value);
      updateAll();
    });
    valueInputs.set(def.key, {range, number});
    return wrap;
  }

  if(def.type === "choice"){
    const segmented = document.createElement("div");
    segmented.className = "segmented";
    def.values.forEach((value) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "segButton";
      btn.dataset.option = def.key;
      btn.dataset.value = value;
      btn.textContent = humanizeValue(value);
      btn.addEventListener("click", () => {
        setOptionValue(def.key, value);
        updateAll();
      });
      segmented.appendChild(btn);
    });
    valueInputs.set(def.key, segmented);
    return segmented;
  }

  const textarea = document.createElement("textarea");
  textarea.className = "curatedInput";
  textarea.dataset.option = def.key;
  textarea.spellcheck = false;
  textarea.addEventListener("input", updateAll);
  valueInputs.set(def.key, textarea);
  return textarea;
}

function renderCatalog(){
  els.catalogGrid.innerHTML = "";
  WORLD_GROUPS.forEach((group) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "groupButton";
    if(!group.ready) btn.classList.add("notReady");
    btn.dataset.groupKey = group.key;
    btn.style.setProperty("--group-image", `url("${group.image}")`);
    btn.innerHTML = `
      <span class="groupButtonInner">
        <span class="groupCode">${escapeHtml(group.ready ? "READY" : "DATA PENDING")}</span>
        <span class="groupName">${escapeHtml(group.label)}</span>
        <span class="groupTables">${escapeHtml(group.codes.join(", "))}</span>
      </span>
    `;
    btn.addEventListener("click", () => toggleGroup(group.key));
    els.catalogGrid.appendChild(btn);
  });
}

function bindGlobalControls(){
  document.querySelectorAll("[data-preset]").forEach((btn) => {
    btn.addEventListener("click", () => applyPreset(btn.dataset.preset));
  });
  els.playerName.addEventListener("input", updateAll);
  els.gameKey.addEventListener("input", updateAll);
  els.description.addEventListener("input", updateAll);
  els.copyBtn.addEventListener("click", copyYaml);
  els.downloadBtn.addEventListener("click", downloadYaml);
  els.matchCountBtn.addEventListener("click", () => {
    const selected = getCuratedKeys();
    const tableCount = clamp(Math.max(1, selected.length) * 5, 5, 25);
    setOptionValue("base_game_active_table_count", tableCount);
    updateAll();
  });
  els.shuffleGroupsBtn.addEventListener("click", () => {
    const keys = getCuratedKeys();
    for(let i = keys.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [keys[i], keys[j]] = [keys[j], keys[i]];
    }
    setCuratedKeys(keys);
    updateAll();
  });
  els.clearGroupsBtn.addEventListener("click", () => {
    setCuratedKeys([]);
    updateAll();
  });
}

function applyPreset(name){
  const preset = PRESETS[name] || PRESETS.noTrap;
  els.playerName.value = preset.playerName;
  els.gameKey.value = GAME_KEY;
  els.description.value = preset.description;
  OPTION_DEFS.forEach((def) => {
    const value = Object.prototype.hasOwnProperty.call(preset.values, def.key) ? preset.values[def.key] : def.defaultValue;
    setOptionValue(def.key, value);
  });
  updateAll();
}

function getOptionValue(key){
  const def = OPTION_DEFS.find((item) => item.key === key);
  const input = valueInputs.get(key);
  if(!def || !input) return "";
  if(def.type === "toggle") return Boolean(input.checked);
  if(def.type === "range") return clamp(Number(input.number.value || def.defaultValue), def.min, def.max);
  if(def.type === "choice"){
    const active = input.querySelector(".segButton.active");
    return active ? active.dataset.value : def.defaultValue;
  }
  return String(input.value || "").trim();
}

function setOptionValue(key, value){
  const def = OPTION_DEFS.find((item) => item.key === key);
  const input = valueInputs.get(key);
  if(!def || !input) return;
  if(def.type === "toggle"){
    input.checked = Boolean(value);
    return;
  }
  if(def.type === "range"){
    const numeric = clamp(Number(value), def.min, def.max);
    input.range.value = String(numeric);
    input.number.value = String(numeric);
    return;
  }
  if(def.type === "choice"){
    input.querySelectorAll(".segButton").forEach((btn) => {
      btn.classList.toggle("active", btn.dataset.value === String(value));
    });
    return;
  }
  input.value = String(value ?? "");
}

function updateAll(){
  normalizeRangeSteps();
  renderSelectedGroups();
  syncCatalogSelection();
  const validation = validateState();
  els.yamlOutput.value = buildYaml();
  els.validationBox.innerHTML = validation.map((line) => {
    return `<div class="validationLine ${escapeAttr(line.level)}">${escapeHtml(line.text)}</div>`;
  }).join("");
  els.yamlStatus.textContent = validation.some((line) => line.level === "bad") ? "CHECK OPTIONS" : validation.some((line) => line.level === "warn") ? "READY WITH NOTES" : "READY";
}

function normalizeRangeSteps(){
  for(const def of OPTION_DEFS){
    if(def.type !== "range" || !def.step || def.step <= 1) continue;
    const current = getOptionValue(def.key);
    const stepped = clamp(Math.round(current / def.step) * def.step, def.min, def.max);
    if(stepped !== current) setOptionValue(def.key, stepped);
  }
}

function getCuratedKeys(){
  const raw = getOptionValue("base_game_curated_world_groups");
  if(!raw || /^(auto|default|random|none|0|1)$/i.test(raw)) return [];
  const lookup = buildGroupLookup();
  const out = [];
  raw.split(/[\r\n,|]+/).map((part) => part.trim()).filter(Boolean).forEach((token) => {
    const key = lookup.get(normalizeToken(token)) || token;
    if(key && !out.includes(key)) out.push(key);
  });
  return out;
}

function setCuratedKeys(keys){
  const clean = keys.map((key) => String(key || "").trim()).filter(Boolean);
  setOptionValue("base_game_curated_world_groups", clean.length ? clean.join(", ") : "auto");
}

function toggleGroup(key){
  const group = WORLD_GROUPS.find((item) => item.key === key);
  if(!group || !group.ready) return;
  const keys = getCuratedKeys();
  const index = keys.indexOf(key);
  if(index >= 0){
    keys.splice(index, 1);
  }else{
    keys.push(key);
  }
  setCuratedKeys(keys);
  if(getOptionValue("base_game_selection_mode") === "random_catalog_pool"){
    setOptionValue("base_game_selection_mode", "curated_catalog_groups");
  }
  updateAll();
}

function renderSelectedGroups(){
  const keys = getCuratedKeys();
  els.selectedGroups.innerHTML = "";
  if(!keys.length){
    const empty = document.createElement("div");
    empty.className = "validationLine warn";
    empty.textContent = "No curated world groups selected.";
    els.selectedGroups.appendChild(empty);
  }
  keys.forEach((key, index) => {
    const group = WORLD_GROUPS.find((item) => item.key === key);
    const chip = document.createElement("div");
    chip.className = "selectedChip";
    chip.innerHTML = `
      <div class="chipLabel">
        ${escapeHtml(group ? group.label : key)}
        <div class="chipKey">${escapeHtml(key)}</div>
      </div>
      <button class="iconButton" type="button" aria-label="Move ${escapeAttr(key)} up">UP</button>
      <button class="iconButton" type="button" aria-label="Move ${escapeAttr(key)} down">DN</button>
      <button class="iconButton danger" type="button" aria-label="Remove ${escapeAttr(key)}">X</button>
    `;
    const [up, down, remove] = chip.querySelectorAll("button");
    up.disabled = index === 0;
    down.disabled = index === keys.length - 1;
    up.addEventListener("click", () => {
      [keys[index - 1], keys[index]] = [keys[index], keys[index - 1]];
      setCuratedKeys(keys);
      updateAll();
    });
    down.addEventListener("click", () => {
      [keys[index + 1], keys[index]] = [keys[index], keys[index + 1]];
      setCuratedKeys(keys);
      updateAll();
    });
    remove.addEventListener("click", () => {
      keys.splice(index, 1);
      setCuratedKeys(keys);
      updateAll();
    });
    els.selectedGroups.appendChild(chip);
  });

  const requestedWorlds = Math.max(1, Math.floor(getOptionValue("base_game_active_table_count") / 5));
  els.selectedCount.textContent = String(keys.length);
  els.requestedCount.textContent = String(requestedWorlds);
  els.tableCount.textContent = String(getOptionValue("base_game_active_table_count"));
}

function syncCatalogSelection(){
  const selected = new Set(getCuratedKeys());
  els.catalogGrid.querySelectorAll(".groupButton").forEach((btn) => {
    btn.classList.toggle("selected", selected.has(btn.dataset.groupKey));
  });
}

function validateState(){
  const lines = [];
  const playerName = els.playerName.value.trim();
  const gameKey = els.gameKey.value.trim();
  const selected = getCuratedKeys();
  const requestedWorlds = Math.max(1, Math.floor(getOptionValue("base_game_active_table_count") / 5));
  const selectionMode = getOptionValue("base_game_selection_mode");
  const knownKeys = new Set(WORLD_GROUPS.map((group) => group.key));
  const unready = selected.filter((key) => {
    const group = WORLD_GROUPS.find((item) => item.key === key);
    return group && !group.ready;
  });
  const unknown = selected.filter((key) => !knownKeys.has(key));

  if(!playerName) lines.push({level:"bad", text:"Player name is empty."});
  if(!gameKey) lines.push({level:"bad", text:"Game key is empty."});
  if(selectionMode !== "random_catalog_pool" && selected.length === 0){
    lines.push({level:"warn", text:"Curated or hybrid mode has no curated groups, so generation will random-fill."});
  }
  if(selectionMode === "curated_catalog_groups" && selected.length !== requestedWorlds){
    lines.push({level:"warn", text:`Curated mode has ${selected.length} selected groups for ${requestedWorlds} requested worlds.`});
  }
  if(unknown.length){
    lines.push({level:"warn", text:`Unknown selectors will be passed through: ${unknown.join(", ")}`});
  }
  if(unready.length){
    lines.push({level:"warn", text:`Selected groups not generation-ready yet: ${unready.join(", ")}`});
  }
  if(getOptionValue("filter_mode_trap_enabled") && getOptionValue("filler_traps") === 0){
    lines.push({level:"warn", text:"Filter Mode Trap is enabled while filler_traps is 0."});
  }
  if(getOptionValue("base_game_starting_open_table_count") > getOptionValue("base_game_active_table_count")){
    lines.push({level:"bad", text:"Starting open table count is larger than active table count."});
  }
  if(!lines.length){
    lines.push({level:"good", text:`Ready: ${playerName || "player"} YAML targets ${requestedWorlds} world group${requestedWorlds === 1 ? "" : "s"}.`});
  }
  return lines;
}

function buildYaml(){
  const gameKey = els.gameKey.value.trim() || GAME_KEY;
  const lines = [];
  lines.push(`name: ${yamlScalar(els.playerName.value.trim() || "Player")}`);
  lines.push(`description: ${yamlScalar(els.description.value.trim() || "Flippermizer Base Game AP player options.", true)}`);
  lines.push(`game: ${yamlScalar(gameKey)}`);
  lines.push("");
  lines.push(`${gameKey}:`);
  OPTION_DEFS.forEach((def) => {
    lines.push(`  ${def.key}: ${yamlScalar(getOptionValue(def.key), def.type === "text")}`);
  });
  return lines.join("\n") + "\n";
}

async function copyYaml(){
  const text = els.yamlOutput.value;
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
    }else{
      els.yamlOutput.focus();
      els.yamlOutput.select();
      document.execCommand("copy");
      els.yamlOutput.setSelectionRange(0, 0);
    }
    flashStatus("COPIED");
  }catch(_){
    els.yamlOutput.focus();
    els.yamlOutput.select();
    flashStatus("SELECTED");
  }
}

function downloadYaml(){
  const name = sanitizeFileName(els.playerName.value.trim() || "Flippermizer_Player");
  const blob = new Blob([els.yamlOutput.value], {type:"text/yaml;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = `${name}.yaml`;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 500);
  flashStatus("DOWNLOADED");
}

function flashStatus(text){
  els.yamlStatus.textContent = text;
  clearTimeout(flashStatus.timer);
  flashStatus.timer = setTimeout(updateAll, 900);
}

function yamlScalar(value, forceQuote = false){
  if(typeof value === "boolean") return value ? "true" : "false";
  if(typeof value === "number" && Number.isFinite(value)) return String(value);
  const text = String(value ?? "");
  if(!forceQuote && /^[A-Za-z0-9_./:-]+$/.test(text) && !/^(true|false|null|yes|no|on|off)$/i.test(text)){
    return text;
  }
  return `"${text.replace(/\\/g, "\\\\").replace(/"/g, '\\"')}"`;
}

function buildGroupLookup(){
  const lookup = new Map();
  WORLD_GROUPS.forEach((group) => {
    [group.key, group.label, ...group.codes].forEach((token) => {
      lookup.set(normalizeToken(token), group.key);
    });
  });
  return lookup;
}

function normalizeToken(value){
  return String(value || "").trim().toLowerCase().replace(/[^a-z0-9]+/g, "");
}

function humanizeValue(value){
  return String(value || "").replace(/_/g, " ").replace(/\b\w/g, (char) => char.toUpperCase());
}

function clamp(value, min, max){
  const safe = Number.isFinite(value) ? value : min;
  return Math.max(min, Math.min(max, safe));
}

function sanitizeFileName(value){
  return String(value || "Flippermizer_Player").replace(/[^A-Za-z0-9_.-]+/g, "_").replace(/^_+|_+$/g, "") || "Flippermizer_Player";
}

function escapeHtml(value){
  return String(value ?? "").replace(/[&<>"']/g, (char) => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[char]);
}

function escapeAttr(value){
  return escapeHtml(value);
}

document.addEventListener("DOMContentLoaded", init);
</script>
