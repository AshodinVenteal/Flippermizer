<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crystal Project YAML Options</title>
<style>
:root{
  --bg:#101418;
  --bg2:#171d23;
  --panel:#f7f8f9;
  --panel2:#eef2f4;
  --ink:#162027;
  --muted:#5c6870;
  --line:#cbd5dc;
  --lineDark:#82919b;
  --accent:#0f766e;
  --accent2:#2563eb;
  --gold:#b7791f;
  --danger:#b42318;
  --shadow:rgba(5,10,15,.24);
  --mono:Consolas, "Courier New", monospace;
  --ui:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{
  color:var(--ink);
  font-family:var(--ui);
  background:
    linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px),
    linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
    linear-gradient(135deg, var(--bg), #1a2a2b 54%, #24212a);
  background-size:32px 32px,32px 32px,auto;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.55}
.app{width:min(1680px, calc(100vw - 28px));margin:0 auto;padding:16px 0 22px}
.topbar{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:14px;
  align-items:start;
  padding:16px;
  color:#f8fafc;
  border:1px solid rgba(255,255,255,.18);
  border-radius:8px;
  background:linear-gradient(135deg, rgba(15,118,110,.88), rgba(37,99,235,.62) 62%, rgba(183,121,31,.54));
  box-shadow:0 14px 32px var(--shadow);
}
h1{margin:0;font-size:clamp(24px,3vw,38px);line-height:1.08;letter-spacing:0}
.meta{margin-top:8px;display:flex;flex-wrap:wrap;gap:8px;color:#e9f2f7;font-size:13px}
.pill{display:inline-flex;align-items:center;min-height:30px;padding:5px 9px;border:1px solid rgba(255,255,255,.28);border-radius:8px;background:rgba(0,0,0,.2);font-family:var(--mono)}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.button{
  min-height:38px;
  border:1px solid rgba(255,255,255,.34);
  border-radius:8px;
  padding:8px 12px;
  color:#fff;
  background:rgba(12,18,24,.32);
  font-weight:700;
}
.button.primary{background:rgba(15,118,110,.96)}
.button.gold{background:rgba(183,121,31,.96)}
.workspace{display:grid;grid-template-columns:minmax(360px,.9fr) minmax(460px,1fr);gap:14px;align-items:start;margin-top:14px}
.panel{
  min-width:0;
  overflow:hidden;
  border:1px solid var(--lineDark);
  border-radius:8px;
  background:linear-gradient(180deg,var(--panel),var(--panel2));
  box-shadow:0 12px 28px var(--shadow);
}
.panelHeader{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:center;
  min-height:54px;
  padding:12px 14px;
  color:#fff;
  background:linear-gradient(90deg,#24323a,#0f766e);
}
.panelHeader h2{margin:0;font-size:17px;line-height:1.2;letter-spacing:0}
.panelKicker{font-family:var(--mono);font-size:12px;color:#dce8ed;white-space:nowrap}
.panelBody{padding:14px}
.fieldGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.field{display:grid;gap:6px}
.field.full{grid-column:1/-1}
.field label,.optionCode,.entryKeyLabel{font-family:var(--mono);font-size:12px;font-weight:700;color:#33424b}
input,select,textarea{
  width:100%;
  min-width:0;
  border:1px solid #aab7bf;
  border-radius:8px;
  padding:9px 10px;
  color:var(--ink);
  background:#fff;
}
textarea{resize:vertical}
.toolbar{display:grid;grid-template-columns:minmax(0,1fr) minmax(160px,240px);gap:10px;margin-bottom:12px}
.groupSection{margin-bottom:14px}
.groupSection:last-child{margin-bottom:0}
.groupTitle{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:8px;
  padding-bottom:7px;
  border-bottom:1px solid var(--line);
}
.groupTitle h3{margin:0;font-size:16px;line-height:1.2}
.optionBlock{
  display:grid;
  gap:10px;
  margin-bottom:10px;
  padding:12px;
  border:1px solid var(--line);
  border-radius:8px;
  background:rgba(255,255,255,.62);
}
.optionBlock:last-child{margin-bottom:0}
.optionHead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start}
.optionTitle{margin:0;font-size:15px;line-height:1.25}
.optionCode{padding:3px 7px;border:1px solid var(--line);border-radius:8px;background:#f8fafc;white-space:nowrap}
.optionDesc{margin:0;color:var(--muted);font-size:13px;line-height:1.45;white-space:pre-line}
.rangeNote{display:flex;gap:8px;flex-wrap:wrap;margin-top:-2px}
.rangeNote span{font-family:var(--mono);font-size:11px;color:#fff;padding:3px 7px;border-radius:8px;background:#50616b}
.directControl{display:grid;gap:9px}
.choiceControl{display:grid;grid-template-columns:minmax(180px,280px) minmax(0,1fr);gap:9px;align-items:center}
.choiceNote{min-height:36px;display:flex;align-items:center;color:var(--muted);font-size:12px;line-height:1.3}
.toggleControl{display:flex;align-items:center;gap:10px;width:max-content;max-width:100%}
.toggleControl input{position:absolute;width:auto;opacity:0;pointer-events:none}
.switchRail{
  position:relative;
  width:54px;
  height:30px;
  flex:0 0 auto;
  border:1px solid #8fa0aa;
  border-radius:999px;
  background:#d8e1e6;
  transition:background .16s ease,border-color .16s ease;
}
.switchRail::after{
  content:"";
  position:absolute;
  top:3px;
  left:3px;
  width:22px;
  height:22px;
  border-radius:999px;
  background:#fff;
  box-shadow:0 2px 7px rgba(0,0,0,.22);
  transition:transform .16s ease;
}
.toggleControl input:checked + .switchRail{background:var(--accent);border-color:var(--accent)}
.toggleControl input:checked + .switchRail::after{transform:translateX(24px)}
.switchText{font-weight:800;color:#27343c}
.rangeControl{display:grid;gap:9px}
.rangeModeRow{display:grid;grid-template-columns:minmax(180px,280px) minmax(0,1fr);gap:9px;align-items:center}
.rangeValueRow{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:9px;align-items:center}
.rangeValueRow input[type="range"]{padding:0}
.rangeValueRow input:disabled{opacity:.58}
.rangeValueRow.hidden{display:none}
.entryList{display:grid;gap:7px}
.entryRow{display:grid;grid-template-columns:minmax(120px,.9fr) minmax(90px,.45fr) minmax(130px,1fr) 34px;gap:7px;align-items:start}
.entryRow input{min-height:36px;padding:7px 8px;font-family:var(--mono);font-size:13px}
.entryNote{min-height:36px;display:flex;align-items:center;color:var(--muted);font-size:12px;line-height:1.25}
.miniButton{
  min-height:34px;
  border:1px solid var(--lineDark);
  border-radius:8px;
  padding:6px 9px;
  color:var(--ink);
  background:#fff;
  font-weight:700;
}
.miniButton.add{width:max-content;color:#fff;background:var(--accent);border-color:var(--accent)}
.miniButton.remove{padding:0;color:#fff;background:var(--danger);border-color:var(--danger)}
.rawInput{min-height:90px;font-family:var(--mono);font-size:13px;line-height:1.45}
.yamlOutput{min-height:calc(100vh - 206px);font-family:var(--mono);font-size:13px;line-height:1.45;white-space:pre;tab-size:2}
.status{margin-top:10px;color:var(--muted);font-size:13px;line-height:1.4}
.hidden{display:none}
@media (max-width:980px){
  .topbar,.workspace{grid-template-columns:1fr}
  .actions{justify-content:flex-start}
  .fieldGrid,.toolbar,.choiceControl,.rangeModeRow{grid-template-columns:1fr}
  .entryRow{grid-template-columns:1fr 120px 1fr 34px}
  .yamlOutput{min-height:420px}
}
@media (max-width:620px){
  .app{width:min(100% - 18px,1680px);padding-top:9px}
  .topbar,.panelBody{padding:12px}
  .entryRow{grid-template-columns:1fr}
  .miniButton.remove{width:42px;min-height:34px}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div>
      <h1>Crystal Project YAML Options</h1>
      <div class="meta">
        <span class="pill" id="sourcePill"></span>
        <span class="pill" id="versionPill"></span>
        <span class="pill" id="countPill"></span>
      </div>
    </div>
    <div class="actions">
      <button class="button primary" type="button" id="copyBtn">Copy YAML</button>
      <button class="button gold" type="button" id="downloadBtn">Download</button>
    </div>
  </header>

  <main class="workspace">
    <section class="panel">
      <div class="panelHeader">
        <h2>Options</h2>
        <span class="panelKicker" id="visibleCount"></span>
      </div>
      <div class="panelBody">
        <div class="fieldGrid">
          <div class="field">
            <label for="playerName">Player Name</label>
            <input id="playerName" type="text" maxlength="64">
          </div>
          <div class="field">
            <label for="requiresVersion">AP Version</label>
            <input id="requiresVersion" type="text">
          </div>
          <div class="field full">
            <label for="description">Description</label>
            <input id="description" type="text">
          </div>
        </div>
        <div class="toolbar">
          <input id="searchBox" type="search" placeholder="Search options">
          <select id="groupFilter" aria-label="Group filter"></select>
        </div>
        <div id="optionsMount"></div>
      </div>
    </section>

    <section class="panel">
      <div class="panelHeader">
        <h2>YAML Output</h2>
        <span class="panelKicker" id="yamlStatus">Ready</span>
      </div>
      <div class="panelBody">
        <textarea class="yamlOutput" id="yamlOutput" spellcheck="false" readonly></textarea>
        <div class="status" id="statusLine"></div>
      </div>
    </section>
  </main>
</div>

<script>
const PAGE_DATA = {"sourceName":"YAMLs/Crystal.Project.yaml","fileName":"crystal_project_yaml_options.html","slug":"crystal_project","templateName":"Player{number}","templateDescription":"Default Crystal Project Template","game":"Crystal Project","requiresVersion":"0.6.5","worldVersion":"0.14.0","options":[{"key":"progression_balancing","label":"Progression Balancing","group":"Game Options","description":"A system that can move progression earlier, to try and prevent the player from getting stuck and bored early.\n\nA lower setting means more getting stuck. A higher setting means less getting stuck.\n\nYou can define additional values between the minimum and maximum values.\nMinimum value is 0\nMaximum value is 99","rangeMin":0,"rangeMax":99,"kind":"entries","entries":[{"key":"random","value":"0","note":""},{"key":"random-low","value":"0","note":"random value weighted towards lower values"},{"key":"random-high","value":"0","note":"random value weighted towards higher values"},{"key":"random-range-0-99","value":"0","note":"random value between 0 and 99"},{"key":"disabled","value":"0","note":"equivalent to 0"},{"key":"normal","value":"50","note":"equivalent to 50"},{"key":"extreme","value":"0","note":"equivalent to 99"}],"control":"range"},{"key":"accessibility","label":"Accessibility","group":"Game Options","description":"Set rules for reachability of your items/locations.\n\n**Full:** ensure everything can be reached and acquired.\n\n**Minimal:** ensure what is needed to reach your goal can be acquired.","rangeMin":null,"rangeMax":null,"kind":"entries","entries":[{"key":"full","value":"50","note":""},{"key":"minimal","value":"0","note":""}],"control":"choice"},{"key":"trap_likelihood","label":"Trap Likelihood","group":"Game Options","description":"This is the likelihood that a trap will replace a filler check. A value of 0 means no traps.\n\nYou can define additional values between the minimum and maximum values.\nMinimum value is 0\nMaximum value is 100","rangeMin":0,"rangeMax":100,"kind":"entries","entries":[{"key":"0","value":"50","note":""},{"key":"random","value":"0","note":""},{"key":"random-low","value":"0","note":"random value weighted towards lower values"},{"key":"random-high","value":"0","note":"random value weighted towards higher values"},{"key":"random-range-0-100","value":"0","note":"random value between 0 and 100"}],"control":"range"},{"key":"goal","label":"Goal","group":"Goal Options","description":"Choose what is required to complete the game.\n\nChecking the first sign in the Spawning Meadows will tell you the selected goal. A goal items counter is displayed on the in-game party screen in the menu.\n\nAstley: Defeat Astley in the New World. The throne room in The New World will unlock once you have found enough Jobs (starting Jobs don't count).\n\nTrue Astley: A saga awaits you! Collect 4 Deity Eyes and the STEM WARD to challenge Gabriel for the Old World Stone. Then travel to the Old World to defeat Periculum and earn the Proof of Merit.\nAlong the way, gather enough Jobs to unlock the throne room in The New World. Then, venture there to defeat true Astley to win!\n\nClamshells: Collect enough clamshells for Mañana Man in Seaside Cliffs.","rangeMin":null,"rangeMax":null,"kind":"entries","entries":[{"key":"astley","value":"50","note":""},{"key":"true_astley","value":"0","note":""},{"key":"clamshells","value":"0","note":""}],"control":"choice"},{"key":"clamshell_goal_quantity","label":"Clamshell Goal Quantity","group":"Goal Options","description":"If your goal is Clamshells, select how many you need to win.\n\n(If your goal is not Clamshells, this setting does nothing. 3 Clamshells will be placed in your pool and the Mañana Man will ask for 2. Don't worry, he's cool with it.)\n\nYou can define additional values between the minimum and maximum values.\nMinimum value is 1\nMaximum value is 99","rangeMin":1,"rangeMax":99,"kind":"entries","entries":[{"key":"13","value":"50","note":""},{"key":"random","value":"0","note":""},{"key":"random-low","value":"0","note":"random value weighted towards lower values"},{"key":"random-high","value":"0","note":"random value weighted towards higher values"},{"key":"random-range-1-99","value":"0","note":"random value between 1 and 99"}],"control":"range"},{"key":"extra_clamshells_in_pool","label":"Extra Clamshells In Pool","group":"Goal Options","description":"If your goal is Clamshells, pick how many more Clamshells than your goal value to have in the item pool.\nThis option makes it so that you don't have to find every single Clamshell in your pool to win.\n\n(If your goal is not Clamshells, this setting does nothing.)\n\nYou can define additional values between the minimum and maximum values.\nMinimum value is 0\nMaximum value is 99","rangeMin":0,"rangeMax":99,"kind":"entries","entries":[{"key":"6","value":"50","note":""},{"key":"random","value":"0","note":""},{"key":"random-low","value":"0","note":"random value weighted towards lower values"},{"key":"random-high","value":"0","note":"random value weighted towards higher values"},{"key":"random-range-0-99","value":"0","note":"random value between 0 and 99"}],"control":"range"},{"key":"astley_job_quantity","label":"Astley Job Quantity","group":"Goal Options","description":"If your goal is Astley or True Astley, select how many Jobs you need to find to unlock the throne room for the final fight.\n\nThis option is validated at generation time, and if it is higher than the number of Jobs you can obtain, it will be capped to what is possible. By default, the maximum you can obtain is 18.\n\nPicking Job Rando: Full and decreasing the Starting Job Quantity will increase the maximum by that much. It will also increase if you enable mods that give you more.\n\nPicking Job Rando: None and Included Regions: Beginner or Advanced will reduce the maximum number available to 4 or 11, respectively.\n\nYou can define additional values between the minimum and maximum values.\nMinimum value is 1\nMaximum value is 99","rangeMin":1,"rangeMax":99,"kind":"entries","entries":[{"key":"18","value":"50","note":""},{"key":"random","value":"0","note":""},{"key":"random-low","value":"0","note":"random value weighted towards lower values"},{"key":"random-high","value":"0","note":"random value weighted towards higher values"},{"key":"random-range-1-99","value":"0","note":"random value between 1 and 99"}],"control":"range"},{"key":"included_regions","label":"Included Regions","group":"Location Options","description":"Choose which regions to play in! Only locations within your chosen regions will give you checks; the rest will be empty.\nThis can be used to adjust the difficulty and length of your game.\n\nNOTE: Make sure to include the region that has the finish line of your chosen goal in it!\nExample: if your goal is Astley, Advanced is considered to have that finish line, so you can pick Advanced, Expert, or All.\n\nBeginner: Only regions up through the end of Skumparadise will have checks. Finish Line: Clamshells\n\nAdvanced: Regions up to Salmon Bay will have checks. Finish Line: Astley (Note: Level Gating's Level Catch-Up Option is recommended for Astley on Advanced.)\n\nExpert: Regions up to The Deep Sea will have checks. (Note: The Depths will not be included.)\n\nAll: Every region is included. Finish Line: True Astley","rangeMin":null,"rangeMax":null,"kind":"entries","entries":[{"key":"beginner","value":"0","note":""},{"key":"advanced","value":"0","note":""},{"key":"expert","value":"0","note":""},{"key":"all","value":"50","note":""}],"control":"choice"},{"key":"job_rando","label":"Job Rando","group":"Location Options","description":"None: all Jobs are at their normal crystal locations in the vanilla game.\n\nCrystal: all vanilla Jobs normally received from crystals are chucked into the item pool.\n\nFull: your starting jobs are randomized, and the rest of the vanilla Jobs are added to the item pool.\nAdjust the Starting Job Quantity (see below) for how many random Jobs you start with.","rangeMin":null,"rangeMax":null,"kind":"entries","entries":[{"key":"none","value":"0","note":""},{"key":"crystal","value":"0","note":""},{"key":"full","value":"50","note":""}],"control":"choice"},{"key":"starting_job_quantity","label":"Starting Job Quantity","group":"Location Options","description":"Select how many Jobs you start with. (This setting only does anything if JobRando is set to Full.)\n\nYou can define additional values between the minimum and maximum values.\nMinimum value is 1\nMaximum value is 6","rangeMin":1,"rangeMax":6,"kind":"entries","entries":[{"key":"6","value":"50","note":""},{"key":"random","value":"0","note":""},{"key":"random-low","value":"0","note":"random value weighted towards lower values"},{"key":"random-high","value":"0","note":"random value weighted towards higher values"},{"key":"random-range-1-6","value":"0","note":"random value between 1 and 6"}],"control":"range"},{"key":"disable_sparks","label":"Disable Sparks","group":"Location Options","description":"When enabled, enemy sparks are disabled: enemies will completely ignore the player, and touching them does not start combat.\nAn Enable/Disable Sparks button will appear in the game's Archipelago menu that you can use to toggle spark disabling on and off.\nExplore unbothered by fiery plebeians, re-enable them when you deign to grind XP or earn money, and re-disable them when you've had enough of their nonsense!\n\nHowever: if Kill Bosses is enabled, then boss sparks still have your number (a.k.a. chase you and start combat). They can sense your murderous intent.","rangeMin":null,"rangeMax":null,"kind":"entries","entries":[{"key":"false","value":"50","note":""},{"key":"true","value":"0","note":""}],"control":"toggle"},{"key":"kill_bosses_mode","label":"Kill Bosses Mode","group":"Location Options","description":"When enabled, defeating a boss will provide checks.\n\nWARNING: If you restrict the Included Regions to Beginner or Advanced, checks will require defeating level 50+ bosses in some of the early areas!\nYou may want to set the Level Gating option to Level Catch-Up.  Without it, you are signing up to either grind or fight the bosses under-leveled.","rangeMin":null,"rangeMax":null,"kind":"entries","entries":[{"key":"false","value":"50","note":""},{"key":"true","value":"0","note":""}],"control":"toggle"},{"key":"shopsanity","label":"Shopsanity","group":"Location Options","description":"When enabled, all shop inventories will be replaced with checks. Be prepared, adventurer.\n\nChoosing \"enabled and hint\" will, when you CLOSE the store, automatically create a hint for every item you did not purchase\nso other players will realize you have betrayed them by refusing to purchase their key progression item!","rangeMin":null,"rangeMax":null,"kind":"entries","entries":[{"key":"disabled","value":"50","note":""},{"key":"enabled","value":"0","note":""},{"key":"enabled_and_hint","value":"0","note":""}],"control":"choice"},{"key":"regionsanity","label":"Regionsanity","group":"Location Options","description":"Nothing I have tried has been able to drive the citizens of Sequoia to collect enough crystals!\nAdventurers have had TOO MUCH freedom!  From now on, you will adventure where I tell you to.\nUnless you have a pass from ME, you won't be able to do any adventuring!\n- Grandmaster\n\nWhen enabled, the grandmaster will not permit you to interact with anything in a region\nwithout receiving his \"official permission\" (i.e. \"Item - Spawning Meadows Pass\").\nHowever, the Overpass and Underpass are regions of lawlessness where the Grandmaster has no authority! ;)\n(You're also still allowed to use the save points, we won't tell.)\n\nIf you put any region pass items in your starting inventory, the first one will be chosen as your starting region.\n\nIf Regionsanity is set to Extreme, the Grandmaster won't even let you walk through regions you don't have the pass for.\nSpend more than 10 seconds in a region without a pass and the Grandmaster will teleport you!\n\nYou will start the game in a random region with a pass. You will be leveled appropriately.","rangeMin":null,"rangeMax":null,"kind":"entries","entries":[{"key":"disabled","value":"50","note":""},{"key":"enabled","value":"0","note":""},{"key":"extreme","value":"0","note":""}],"control":"choice"},{"key":"regionsanity_starter_region_min_level","label":"Regionsanity Starter Region Min Level","group":"Location Options","description":"This sets the lowest possible level your random starter region could be in Regionsanity.\nAll regions without combat have a level of 0 (e.g. Capital Sequoia and Eastern Chasm). Otherwise, Beginner Regions start at level 3, Advanced at 18, Expert at 36, and End-Game at 60.\n\nYou can define additional values between the minimum and maximum values.\nMinimum value is 0\nMaximum value is 63","rangeMin":0,"rangeMax":63,"kind":"entries","entries":[{"key":"0","value":"50","note":""},{"key":"random","value":"0","note":""},{"key":"random-low","value":"0","note":"random value weighted towards lower values"},{"key":"random-high","value":"0","note":"random value weighted towards higher values"},{"key":"random-range-0-63","value":"0","note":"random value between 0 and 63"}],"control":"range"},{"key":"regionsanity_starter_region_max_level","label":"Regionsanity Starter Region Max Level","group":"Location Options","description":"This sets the highest possible level your random starter region could be in Regionsanity.\nBeginner Regions end at level 15, Advanced at level 38 (except Capital Pipeline at level 50 lol), Expert at 60, and End-Game at 63.\n(The Old World is not allowed to be your starter region. Sorry if you just really wanted to fight Periculum with no gear right off the bat.)\n\nYou can define additional values between the minimum and maximum values.\nMinimum value is 0\nMaximum value is 63","rangeMin":0,"rangeMax":63,"kind":"entries","entries":[{"key":"30","value":"50","note":""},{"key":"random","value":"0","note":""},{"key":"random-low","value":"0","note":"random value weighted towards lower values"},{"key":"random-high","value":"0","note":"random value weighted towards higher values"},{"key":"random-range-0-63","value":"0","note":"random value between 0 and 63"}],"control":"range"},{"key":"home_point_hustle","label":"Home Point Hustle","group":"Location Options","description":"When enabled, every Home Point will give you a check the first time you interact with it, and Home Point teleport items will be added to the pool.\n\nMixed: You can teleport to any Home Point that you have interacted with or have the teleport item for.\nHustle Only: You can ONLY teleport to a Home Point after getting its matching teleport item.","rangeMin":null,"rangeMax":null,"kind":"entries","entries":[{"key":"disabled","value":"50","note":""},{"key":"mixed","value":"0","note":""},{"key":"hustle_only","value":"0","note":""}],"control":"choice"},{"key":"progressive_mount_mode","label":"Progressive Mount Mode","group":"Progression Options","description":"When enabled, all mount items are combined into a Progressive Mount Instrument and will be received in the approximate order you would receive them in the vanilla game:\nQuintar Pass -> Quintar Flute -> Ibek Bell -> Owl Drum -> Salmon Violin -> Salmon Cello -> Quintar Ocarina\n\nWhen disabled, different mount types are separated:\nProgressive Quintar Flute (Quintar Pass -> Quintar Flute -> Quintar Ocarina),\nProgressive Salmon Violin (Salmon Violin -> Salmon Cello),\nIbek Bell,\nand Owl Drum.","rangeMin":null,"rangeMax":null,"kind":"entries","entries":[{"key":"false","value":"0","note":""},{"key":"true","value":"50","note":""}],"control":"toggle"},{"key":"starting_level","label":"Starting Level","group":"Progression Options","description":"Choose what level your party starts at.\n\nNOTE: If any variant of Regionsanity is enabled, you may start at a higher level based on the level of your random starter region. See Regionsanity settings above.\n\nYou can define additional values between the minimum and maximum values.\nMinimum value is 3\nMaximum value is 99","rangeMin":3,"rangeMax":99,"kind":"entries","entries":[{"key":"3","value":"50","note":""},{"key":"random","value":"0","note":""},{"key":"random-low","value":"0","note":"random value weighted towards lower values"},{"key":"random-high","value":"0","note":"random value weighted towards higher values"},{"key":"random-range-3-99","value":"0","note":"random value between 3 and 99"}],"control":"range"},{"key":"level_gating","label":"Level Gating","group":"Progression Options","description":"When enabled, the party's level is considered for Archipelago logic, and Progressive Level items are added to the pool. (This won't stop you from beating the game at level 3. ^_^)\n\nNone: Level gating is disabled. No Progressive Levels in the pool.\n\nLevel Passes: Progressive Levels are added to the pool. They do not affect the party's actual level or level cap. Archipelago will expect you to collect them to access level-gated areas,\nand in-game tracking will light up checks that you have access to based on that level.\n\nLevel Capped: The party's maximum level is hard capped. Progressive Levels are added to the pool. Collecting them allows your party to gain more levels, and in-game tracking will light up\nchecks that you have access to based on that max level.\n\nLevel Catch-Up: Progressive Levels are added to the pool. Collecting them will help your party catch up in levels (and LP!) based on the number you've collected. 2 LP are granted per 1 level granted.\nFor example, if your Starting Level is 3 (above) and Progressive Level Size (below) is 6, 1 Progressive Level will bring your party's level up to 9. If your party has already reached that level,\nno extra levels will be granted. In-game tracking will light up checks that you have access to based on the number you have collected.\n\nLevel Set: A combination of Level Catch-Up and Capped. The player will always be at the level set by the Progressive Level. There is no escape.\n\nFor example, if your Starting Level (above) is 3 and Progressive Level Size (below) is 6, the Level Gating options would behave like this:\nLevel Passes - Your party's level starts at 3. The first Progressive Level you collect will signal that areas up to 9 are now logic, the second up to 15, etc.\nLevel Capped - Your party's level and level cap start at 3. The first Progressive Level you collect will increase your party's level cap to 9, the second to 15, and so on.\nLevel Catch-Up - Your party's level starts at 3. The first Progressive Level you collect will bring your party's level up to 9 if it isn't already, the second up to 15, and so on.\nLevel Set - Your party's level and level cap start at 3. The first Progressive Level you collect will increase your party's level and level cap to 9, the second to 15, and so on.","rangeMin":null,"rangeMax":null,"kind":"entries","entries":[{"key":"none","value":"0","note":""},{"key":"level_passes","value":"0","note":""},{"key":"level_capped","value":"0","note":""},{"key":"level_catch_up","value":"50","note":""},{"key":"level_set","value":"0","note":""}],"control":"choice"},{"key":"level_compared_to_enemies","label":"Level Compared To Enemies","group":"Progression Options","description":"If Level Gating is on, this option changes what level you're expected to fight enemies. In Regionsanity, it will be added to your starting level.\nSet it higher if you want to be a higher level than enemies when you enter a region, or lower if you want to be lower.\n\nFor example, if this is set to 5, and the enemy level of a region is 12, then the Level Gating options would require you to unlock level 17 (or for Level Capped, max level 17) for that region.\nIf it's set to -5, and the enemy level of a region is 12, then the Level Gating options would require you to unlock level 7 (or for Level Capped, max level 7) for that region.\n\nDefault is 0, or on-level for the enemy level of a region.\n\nNote: Remember to increase your Max Level (see below) if you want regions with high-level enemies to still be lower level than you.\nNote #2: Spark color changes: red at -10 levels, orange at -5, green at +3, and grey +10. (Though enemies can be 3-5 levels above the min enemy level for a region.)\n\nYou can define additional values between the minimum and maximum values.\nMinimum value is -10\nMaximum value is 10","rangeMin":-10,"rangeMax":10,"kind":"entries","entries":[{"key":"0","value":"50","note":""},{"key":"random","value":"0","note":""},{"key":"random-low","value":"0","note":"random value weighted towards lower values"},{"key":"random-high","value":"0","note":"random value weighted towards higher values"},{"key":"random-range--10-10","value":"0","note":"random value between -10 and 10"}],"control":"range"},{"key":"progressive_level_size","label":"Progressive Level Size","group":"Progression Options","description":"If Level Gating is on, Progressive Levels will be added to the item pool. This sets the number of levels that an individual Progressive Level will grant.\n\nYou can define additional values between the minimum and maximum values.\nMinimum value is 1\nMaximum value is 10","rangeMin":1,"rangeMax":10,"kind":"entries","entries":[{"key":"6","value":"50","note":""},{"key":"random","value":"0","note":""},{"key":"random-low","value":"0","note":"random value weighted towards lower values"},{"key":"random-high","value":"0","note":"random value weighted towards higher values"},{"key":"random-range-1-10","value":"0","note":"random value between 1 and 10"}],"control":"range"},{"key":"max_level","label":"Max Level","group":"Progression Options","description":"This allows your party to level past the default maximum level of 60. If Level Gating is on, increasing this number will also put more Progressive Levels in your pool.\n\nSet it below 60 at your own risk <3\n\nYou can define additional values between the minimum and maximum values.\nMinimum value is 3\nMaximum value is 99","rangeMin":3,"rangeMax":99,"kind":"entries","entries":[{"key":"60","value":"50","note":""},{"key":"random","value":"0","note":""},{"key":"random-low","value":"0","note":"random value weighted towards lower values"},{"key":"random-high","value":"0","note":"random value weighted towards higher values"},{"key":"random-range-3-99","value":"0","note":"random value between 3 and 99"}],"control":"range"},{"key":"starting_passive_points","label":"Starting Passive Points","group":"Progression Options","description":"The number of Passive Points each party member starts with. Default is the vanilla value of 10.\n\nYou can define additional values between the minimum and maximum values.\nMinimum value is 0\nMaximum value is 50","rangeMin":0,"rangeMax":50,"kind":"entries","entries":[{"key":"10","value":"50","note":""},{"key":"random","value":"0","note":""},{"key":"random-low","value":"0","note":"random value weighted towards lower values"},{"key":"random-high","value":"0","note":"random value weighted towards higher values"},{"key":"random-range-0-50","value":"0","note":"random value between 0 and 50"}],"control":"range"},{"key":"maximum_passive_points","label":"Maximum Passive Points","group":"Progression Options","description":"The maximum number of Passive Points each party member can have. Default is the vanilla value of 10.\n\nIf you set your Maximum Passive Points higher than your Starting Passive Points, Passive Point Boosts will be added to the item pool that increase your party's available Passive Points when found.\n\nYou can define additional values between the minimum and maximum values.\nMinimum value is 0\nMaximum value is 50","rangeMin":0,"rangeMax":50,"kind":"entries","entries":[{"key":"10","value":"50","note":""},{"key":"random","value":"0","note":""},{"key":"random-low","value":"0","note":"random value weighted towards lower values"},{"key":"random-high","value":"0","note":"random value weighted towards higher values"},{"key":"random-range-0-50","value":"0","note":"random value between 0 and 50"}],"control":"range"},{"key":"passive_point_boost_size","label":"Passive Point Boost Size","group":"Progression Options","description":"This sets the number of Passive Points you gain per Passive Point Boost.\n\nYou can define additional values between the minimum and maximum values.\nMinimum value is 1\nMaximum value is 10","rangeMin":1,"rangeMax":10,"kind":"entries","entries":[{"key":"2","value":"50","note":""},{"key":"random","value":"0","note":""},{"key":"random-low","value":"0","note":"random value weighted towards lower values"},{"key":"random-high","value":"0","note":"random value weighted towards higher values"},{"key":"random-range-1-10","value":"0","note":"random value between 1 and 10"}],"control":"range"},{"key":"key_mode","label":"Key Mode","group":"Progression Options","description":"Skeleton Key: Only the Skeleton Key, which can open any locked door, will be in your item pool.\n\nKey Ring: Keys for individual dungeons will be grouped into Key Rings. Each Key Ring will give all keys needed to complete one dungeon. The Skeleton Key will still be in the pool.\n\nVanilla: All vanilla keys will be in the item pool.\n\nSkelefree: Same as the named mode, but removes the Skeleton Key.","rangeMin":null,"rangeMax":null,"kind":"entries","entries":[{"key":"skeleton","value":"0","note":""},{"key":"key_ring","value":"0","note":""},{"key":"vanilla","value":"50","note":""},{"key":"key_ring_skelefree","value":"0","note":""},{"key":"vanilla_skelefree","value":"0","note":""}],"control":"choice"},{"key":"obscure_routes","label":"Obscure Routes","group":"Progression Options","description":"When enabled, connections between regions that are difficult to find will be expected in logic.","rangeMin":null,"rangeMax":null,"kind":"entries","entries":[{"key":"false","value":"50","note":""},{"key":"true","value":"0","note":""}],"control":"toggle"},{"key":"hop_to_it","label":"Hop To It","group":"Progression Options","description":"No Tricks: No fancy hops expected.\nFancy Footwork: Above-average jumping skill expected, e.g. jumping past the pushblocks in Eaclaneya with no mounts or Auto-Jump-level jumping precision.\nOne Hop Beyond: More jumping tricks expected, like ibek jumping up from underneath a ledge.\nPray: You didn't *want* the Golden Quintar for the Sequoia, did you?","rangeMin":null,"rangeMax":null,"kind":"entries","entries":[{"key":"no_tricks","value":"50","note":""},{"key":"fancy_footwork","value":"0","note":""},{"key":"one_hop_beyond","value":"0","note":""},{"key":"pray","value":"0","note":""}],"control":"choice"},{"key":"prioritize_crystals","label":"Prioritize Crystals","group":"Progression Options","description":"When enabled, crystals will be prioritized when placing progression items.\n\nWhile you're here, did you know that all YAMLs for all worlds include a priority_locations and an exclude_locations option?\nYou can use these to flag any individual location or a location group as priority or excluded.\nPriority locations will be chosen first when placing progression items, and excluded locations will be chosen last.\n\nHere's an example:\npriority_locations = [\"Crystals\", \"Region Completions\", \"Bosses\", \"Salmon River NPC - Win the Salmon Race\"]\n\nCrystal Project's location groups:\n- Every region and subregion; e.g. Shoudu Province, Sky Arena\n- Base groups: Crystals, Mount Instruments, Purple Chests, Ore Nodes\n- Collectible groups: Collectible Turn-ins; Black Squirrels, Dog Bones, Clamshells, Penguins, Quintar Sheddings, Secret Herbs, Undersea Crabs\n- Special access groups: Salmon Race Prizes, Luxury Pass Required\n- NPC groups: Bribe Quests (pay NPC money), Challenge Quests (do a challenge like complete a number of Sky Arena fights,\ncomplete an ice block pushing puzzle, or answer Quizard questions), Fetch Quests (give NPC one or more items),\nGifts (NPC gives you an item), Job Checkers (find a certain number of Jobs to get an item), Fishers\n- Relevant Depending On Your Other Options:\n- Home Point Hustle: Home Points\n- Kill Bosses: Bosses, Summons, End-Game Bosses\n- Regionsanity: Region Completions\n- Shopsanity: Shops","rangeMin":null,"rangeMax":null,"kind":"entries","entries":[{"key":"false","value":"0","note":""},{"key":"true","value":"50","note":""}],"control":"toggle"},{"key":"auto_spend_lp","label":"Auto Spend Lp","group":"Progression Options","description":"When enabled, every time a character earns LP, it will automatically spend LP on abilities or passives.\nExtra LP earned on a job that is maxed will be sent to your sub job or, if that is also maxed, a random un-maxed job.","rangeMin":null,"rangeMax":null,"kind":"entries","entries":[{"key":"false","value":"50","note":""},{"key":"true","value":"0","note":""}],"control":"toggle"},{"key":"auto_equip_passives","label":"Auto Equip Passives","group":"Progression Options","description":"When enabled, every time a character unlocks a new passive, it will equip it immediately if enough passive points are available.\nPassives with drawbacks, that enable equipping more gear types, or that modify threat are not automatically equipped.\nIf mods are enabled, all passives are auto-equipped with no exclusions.","rangeMin":null,"rangeMax":null,"kind":"entries","entries":[{"key":"false","value":"50","note":""},{"key":"true","value":"0","note":""}],"control":"toggle"},{"key":"easy_leveling","label":"Easy Leveling","group":"Progression Options","description":"When enabled, characters will not receive reduced experience for being dead or for being a higher level than the fought enemy.","rangeMin":null,"rangeMax":null,"kind":"entries","entries":[{"key":"false","value":"50","note":""},{"key":"true","value":"0","note":""}],"control":"toggle"},{"key":"progressive_equipment_mode","label":"Progressive Equipment Mode","group":"Item Pool Options","description":"When enabled, each category of weapon and armor will be sent to the player in progressive order from weakest to strongest.\n\nWhen disabled, weapons and armor are fully randomized.","rangeMin":null,"rangeMax":null,"kind":"entries","entries":[{"key":"false","value":"0","note":""},{"key":"true","value":"50","note":""}],"control":"toggle"},{"key":"start_with_treasure_finder","label":"Start With Treasure Finder","group":"Item Pool Options","description":"When enabled, the player will start with the Treasure Finder in their inventory. When disabled, it will be in the item pool.\n\nNOTE: Having the Treasure Finder is required for the in-game minimap to display nearby checks.","rangeMin":null,"rangeMax":null,"kind":"entries","entries":[{"key":"false","value":"0","note":""},{"key":"true","value":"50","note":""}],"control":"toggle"},{"key":"start_with_maps","label":"Start With Maps","group":"Item Pool Options","description":"When enabled, the player will start with all maps in their inventory.\n\nNote: The in-game minimap hides when in an area without its map. The world map will display check location icons but will not draw an area without its map.","rangeMin":null,"rangeMax":null,"kind":"entries","entries":[{"key":"false","value":"0","note":""},{"key":"true","value":"50","note":""}],"control":"toggle"},{"key":"fill_full_map","label":"Fill Full Map","group":"Item Pool Options","description":"When enabled, the world map will start filled in for areas that the player has a map item for.","rangeMin":null,"rangeMax":null,"kind":"entries","entries":[{"key":"false","value":"50","note":""},{"key":"true","value":"0","note":""}],"control":"toggle"},{"key":"include_summon_abilities","label":"Include Summon Abilities","group":"Item Pool Options","description":"When enabled, Summons are added to the item pool.\n\nNote: It is not recommended to turn this off with Job Rando: Full and a low number of starting Jobs. You don't want to get stuck with just a Summoner who can only summon Pinga!\n(I'm sorry, Pinga.)","rangeMin":null,"rangeMax":null,"kind":"entries","entries":[{"key":"false","value":"0","note":""},{"key":"true","value":"50","note":""}],"control":"toggle"},{"key":"include_scholar_abilities","label":"Include Scholar Abilities","group":"Item Pool Options","description":"When enabled, Scholar abilities are added to the item pool. They can still be learned as normal from enemies.","rangeMin":null,"rangeMax":null,"kind":"entries","entries":[{"key":"false","value":"0","note":""},{"key":"true","value":"50","note":""}],"control":"toggle"},{"key":"item_info_mode","label":"Item Info Mode","group":"Bonus Fun","description":"For Full, all treasure and store icons on the map will display if they are progression, useful, or filler items.\n\nFor Earned, all treasure and store icons on the map will display as mimics until you complete 50% of your checks.\n\nFor Obscured, all treasure and store icons on the map will display as mimics permanently.\nIf you find skipping treasures is distasteful but part of your brain always wants to be efficient, this option is for you!\nIt's also good for a race environment.","rangeMin":null,"rangeMax":null,"kind":"entries","entries":[{"key":"full","value":"50","note":""},{"key":"earned","value":"0","note":""},{"key":"obscured","value":"0","note":""}],"control":"choice"},{"key":"randomize_music","label":"Randomize Music","group":"Bonus Fun","description":"When enabled, music will be randomized upon connecting to the AP World. (This toggles the base game's Randomize Music function.)","rangeMin":null,"rangeMax":null,"kind":"entries","entries":[{"key":"false","value":"50","note":""},{"key":"true","value":"0","note":""}],"control":"toggle"},{"key":"use_mods","label":"Use Mods","group":"Bonus Fun","description":"WARNING: This setting is very in beta right now! Enabling it is not recommended for: multiworlds that do not allow releasing items or with Regionsanity enabled\n(some mods add items to regions but don't place them anywhere near that region).\n\nWhen enabled, items and locations added by other Crystal Project mods will be added to the item and location pools at generation. Mods newer than Editor version 30 are incompatible.\n\nMultiworld host instructions:\n1. In order to select the mods you'd like to include in randomization, make a folder named \"crystal_project_mods\" inside your root Archipelago directory.\n2. Go to your Steam installation folder for Crystal Project (<YourSteamInstallFolder>/steamapps/workshop/content/1637730) and find the individual folders for the mods you'd like to include.\n3. Inside each mod's folder is a mod json. Copy that json to the crystal_project_mods folder you made inside the Archipelago directory.\n4. If you have a specific order you want to apply the mods, rename the jsons such that they are in alphabetical order in the order you want them to be applied.\nE.g. name the first mod a_modname, the second b_modname, etc.\n\nNOTE: When this setting is on, all Crystal Project players in the multiworld with this setting enabled MUST use the same mods.\n\nThe in-game tracking will use special icons for modded locations that will not display their accessibility (as we can only guess at how accessible they are based on coordinates,\nand would prefer the tracking to be as accurate as possible).\n\nWhen disabled, only base game locations and items will be randomized. You can still use other mods - at your own risk, adventurer - they just won't add checks.\n\nThe game will warn you if you open a game with mods that don't match the mods used to generate the multiworld. It will warn you even if this setting is disabled for you, if you start playing with mods.","rangeMin":null,"rangeMax":null,"kind":"entries","entries":[{"key":"false","value":"50","note":""},{"key":"true","value":"0","note":""}],"control":"toggle"},{"key":"local_items","label":"Local Items","group":"Item & Location Options","description":"Forces these items to be in their native world.","rangeMin":null,"rangeMax":null,"kind":"raw","raw":"[]","control":"raw"},{"key":"non_local_items","label":"Non Local Items","group":"Item & Location Options","description":"Forces these items to be outside their native world.","rangeMin":null,"rangeMax":null,"kind":"raw","raw":"[]","control":"raw"},{"key":"start_inventory","label":"Start Inventory","group":"Item & Location Options","description":"Start with the specified amount of these items. Example: \"Bomb: 1\"","rangeMin":null,"rangeMax":null,"kind":"raw","raw":"{}","control":"raw"},{"key":"start_inventory_from_pool","label":"Start Inventory From Pool","group":"Item & Location Options","description":"Start with the specified amount of these items and don't place them in the world. Example: \"Bomb: 1\"\n\nThe game decides what the replacement items will be.","rangeMin":null,"rangeMax":null,"kind":"raw","raw":"{}","control":"raw"},{"key":"start_hints","label":"Start Hints","group":"Item & Location Options","description":"Start with these item's locations prefilled into the ``!hint`` command.","rangeMin":null,"rangeMax":null,"kind":"raw","raw":"[]","control":"raw"},{"key":"start_location_hints","label":"Start Location Hints","group":"Item & Location Options","description":"Start with these locations and their item prefilled into the ``!hint`` command.","rangeMin":null,"rangeMax":null,"kind":"raw","raw":"[]","control":"raw"},{"key":"exclude_locations","label":"Exclude Locations","group":"Item & Location Options","description":"Prevent these locations from having an important item.","rangeMin":null,"rangeMax":null,"kind":"raw","raw":"[]","control":"raw"},{"key":"priority_locations","label":"Priority Locations","group":"Item & Location Options","description":"Prevent these locations from having an unimportant item.","rangeMin":null,"rangeMax":null,"kind":"raw","raw":"[]","control":"raw"},{"key":"item_links","label":"Item Links","group":"Item & Location Options","description":"Share part of your item pool with other players.","rangeMin":null,"rangeMax":null,"kind":"raw","raw":"[]","control":"raw"},{"key":"plando_items","label":"Plando Items","group":"Item & Location Options","description":"Generic items plando.","rangeMin":null,"rangeMax":null,"kind":"raw","raw":"[]","control":"raw"}]};
const els = {};

function init(){
  ["sourcePill","versionPill","countPill","visibleCount","copyBtn","downloadBtn","playerName","requiresVersion","description","searchBox","groupFilter","optionsMount","yamlOutput","yamlStatus","statusLine"].forEach((id) => {
    els[id] = document.getElementById(id);
  });

  els.playerName.value = PAGE_DATA.templateName || "Player";
  els.description.value = PAGE_DATA.templateDescription || "";
  els.requiresVersion.value = PAGE_DATA.requiresVersion || "";
  els.sourcePill.textContent = PAGE_DATA.sourceName;
  els.versionPill.textContent = PAGE_DATA.worldVersion ? `World ${PAGE_DATA.worldVersion}` : "World version unset";
  els.countPill.textContent = `${PAGE_DATA.options.length} options`;

  renderGroupFilter();
  renderOptions();
  bindEvents();
  updateAll();
}

function renderGroupFilter(){
  const groups = [...new Set(PAGE_DATA.options.map((option) => option.group || "Options"))];
  els.groupFilter.innerHTML = "";
  const all = document.createElement("option");
  all.value = "";
  all.textContent = "All groups";
  els.groupFilter.appendChild(all);
  groups.forEach((group) => {
    const option = document.createElement("option");
    option.value = group;
    option.textContent = group;
    els.groupFilter.appendChild(option);
  });
}

function renderOptions(){
  els.optionsMount.innerHTML = "";
  const groups = [...new Set(PAGE_DATA.options.map((option) => option.group || "Options"))];
  groups.forEach((groupName) => {
    const groupOptions = PAGE_DATA.options.filter((option) => (option.group || "Options") === groupName);
    const section = document.createElement("section");
    section.className = "groupSection";
    section.dataset.group = groupName;
    section.innerHTML = `
      <div class="groupTitle">
        <h3>${escapeHtml(groupName)}</h3>
        <span class="panelKicker">${groupOptions.length} option${groupOptions.length === 1 ? "" : "s"}</span>
      </div>
      <div class="groupOptions"></div>
    `;
    const mount = section.querySelector(".groupOptions");
    groupOptions.forEach((option) => mount.appendChild(renderOption(option)));
    els.optionsMount.appendChild(section);
  });
}

function renderOption(option){
  const block = document.createElement("article");
  block.className = "optionBlock";
  block.dataset.optionKey = option.key;
  block.dataset.group = option.group || "Options";
  block.dataset.search = `${option.key} ${option.label} ${option.description || ""} ${option.group || ""}`.toLowerCase();
  block.innerHTML = `
    <div class="optionHead">
      <div>
        <h4 class="optionTitle">${escapeHtml(option.label)}</h4>
      </div>
      <span class="optionCode">${escapeHtml(option.key)}</span>
    </div>
  `;

  if(option.description){
    const desc = document.createElement("p");
    desc.className = "optionDesc";
    desc.textContent = option.description;
    block.appendChild(desc);
  }

  if(option.rangeMin !== null || option.rangeMax !== null){
    const range = document.createElement("div");
    range.className = "rangeNote";
    if(option.rangeMin !== null) range.innerHTML += `<span>Min ${option.rangeMin}</span>`;
    if(option.rangeMax !== null) range.innerHTML += `<span>Max ${option.rangeMax}</span>`;
    block.appendChild(range);
  }

  if(option.control === "toggle") block.appendChild(renderToggleControl(option));
  else if(option.control === "range") block.appendChild(renderRangeControl(option));
  else if(option.control === "choice") block.appendChild(renderChoiceControl(option));
  else if(option.control === "map") block.appendChild(renderMapControl(option));
  else block.appendChild(renderRawControl(option));

  return block;
}

function renderToggleControl(option){
  const selected = selectedEntry(option);
  const checked = normalizeBooleanKey(selected.key) === "true";
  const label = document.createElement("label");
  label.className = "toggleControl directControl";
  label.dataset.control = "toggle";
  label.innerHTML = `
    <input class="weightedToggle" type="checkbox" ${checked ? "checked" : ""}>
    <span class="switchRail" aria-hidden="true"></span>
    <span class="switchText"></span>
  `;
  const input = label.querySelector("input");
  const text = label.querySelector(".switchText");
  const sync = () => {
    text.textContent = input.checked ? "True" : "False";
  };
  input.addEventListener("change", () => {
    sync();
    updateAll();
  });
  sync();
  return label;
}

function renderChoiceControl(option){
  const wrap = document.createElement("div");
  wrap.className = "choiceControl directControl";
  wrap.dataset.control = "choice";

  const select = document.createElement("select");
  select.className = "choiceSelect";
  const selected = selectedEntry(option);
  option.entries.forEach((entry) => {
    const choice = document.createElement("option");
    choice.value = entry.key;
    choice.textContent = humanizeValue(entry.key);
    choice.dataset.note = entry.note || "";
    select.appendChild(choice);
  });
  select.value = selected.key || option.entries[0]?.key || "";

  const note = document.createElement("div");
  note.className = "choiceNote";
  const sync = () => {
    const selectedOption = select.selectedOptions[0];
    note.textContent = selectedOption ? selectedOption.dataset.note || "" : "";
  };
  select.addEventListener("change", () => {
    sync();
    updateAll();
  });
  wrap.appendChild(select);
  wrap.appendChild(note);
  sync();
  return wrap;
}

function renderRangeControl(option){
  const wrap = document.createElement("div");
  wrap.className = "rangeControl directControl";
  wrap.dataset.control = "range";

  const selected = selectedEntry(option);
  const selectedIsNumber = isNumericText(selected.key);
  const customValue = selectedIsNumber ? Number(selected.key) : defaultRangeValue(option, selected);
  const min = Number.isFinite(Number(option.rangeMin)) ? Number(option.rangeMin) : 0;
  const max = Number.isFinite(Number(option.rangeMax)) ? Number(option.rangeMax) : Math.max(99, customValue);
  const clampedValue = clamp(customValue, min, max);

  const modeRow = document.createElement("div");
  modeRow.className = "rangeModeRow";
  const mode = document.createElement("select");
  mode.className = "rangeMode";
  mode.innerHTML = `<option value="__custom__">Custom value</option>`;
  option.entries.filter((entry) => !isNumericText(entry.key)).forEach((entry) => {
    const choice = document.createElement("option");
    choice.value = entry.key;
    choice.textContent = humanizeValue(entry.key);
    choice.dataset.note = entry.note || "";
    mode.appendChild(choice);
  });
  mode.value = selectedIsNumber ? "__custom__" : selected.key;

  const note = document.createElement("div");
  note.className = "choiceNote";
  modeRow.appendChild(mode);
  modeRow.appendChild(note);

  const valueRow = document.createElement("div");
  valueRow.className = "rangeValueRow";
  const slider = document.createElement("input");
  slider.className = "rangeSlider";
  slider.type = "range";
  slider.min = String(min);
  slider.max = String(max);
  slider.step = "1";
  slider.value = String(clampedValue);
  const number = document.createElement("input");
  number.className = "rangeNumber";
  number.type = "number";
  number.min = String(min);
  number.max = String(max);
  number.step = "1";
  number.value = String(clampedValue);
  valueRow.appendChild(slider);
  valueRow.appendChild(number);

  const syncValue = (source) => {
    const value = clamp(Number(source.value || min), min, max);
    slider.value = String(value);
    number.value = String(value);
  };
  const syncMode = () => {
    const custom = mode.value === "__custom__";
    const selectedOption = mode.selectedOptions[0];
    if(!custom){
      const selectedRangeEntry = (option.entries || []).find((entry) => entry.key === mode.value);
      const equivalent = selectedRangeEntry ? equivalentValue(selectedRangeEntry.note) : null;
      if(equivalent !== null) syncValue({value: equivalent});
    }
    slider.disabled = !custom;
    number.disabled = !custom;
    note.textContent = custom ? `Value ${number.value}` : selectedOption ? selectedOption.dataset.note || "" : "";
  };
  slider.addEventListener("input", () => {
    syncValue(slider);
    syncMode();
    updateAll();
  });
  number.addEventListener("input", () => {
    syncValue(number);
    syncMode();
    updateAll();
  });
  mode.addEventListener("change", () => {
    syncMode();
    updateAll();
  });

  wrap.appendChild(modeRow);
  wrap.appendChild(valueRow);
  syncMode();
  return wrap;
}

function renderMapControl(option){
  const wrap = document.createElement("div");
  wrap.className = "directControl";
  wrap.dataset.control = "map";
  const list = document.createElement("div");
  list.className = "entryList";
  list.dataset.entryList = option.key;
  option.entries.forEach((entry) => list.appendChild(renderEntryRow(entry)));
  wrap.appendChild(list);
  const add = document.createElement("button");
  add.type = "button";
  add.className = "miniButton add";
  add.textContent = "Add Entry";
  add.addEventListener("click", () => {
    list.appendChild(renderEntryRow({key:"", value:"0", note:""}));
    updateAll();
  });
  wrap.appendChild(add);
  return wrap;
}

function renderRawControl(option){
  const textarea = document.createElement("textarea");
  textarea.className = "rawInput";
  textarea.spellcheck = false;
  textarea.dataset.control = "raw";
  textarea.dataset.rawOption = option.key;
  textarea.value = option.raw || "";
  textarea.addEventListener("input", updateAll);
  return textarea;
}

function renderEntryRow(entry){
  const row = document.createElement("div");
  row.className = "entryRow";

  const keyInput = document.createElement("input");
  keyInput.className = "entryKey";
  keyInput.type = "text";
  keyInput.value = entry.key || "";
  keyInput.setAttribute("aria-label", "Entry key");
  keyInput.addEventListener("input", updateAll);

  const valueInput = document.createElement("input");
  valueInput.className = "entryValue";
  valueInput.type = isNumericText(entry.value) ? "number" : "text";
  if(valueInput.type === "number"){
    valueInput.min = "0";
    valueInput.step = "1";
  }
  valueInput.value = entry.value || "0";
  valueInput.setAttribute("aria-label", "Entry value");
  valueInput.addEventListener("input", updateAll);

  const note = document.createElement("div");
  note.className = "entryNote";
  note.textContent = entry.note || "";

  const remove = document.createElement("button");
  remove.type = "button";
  remove.className = "miniButton remove";
  remove.textContent = "X";
  remove.setAttribute("aria-label", "Remove entry");
  remove.addEventListener("click", () => {
    row.remove();
    updateAll();
  });

  row.appendChild(keyInput);
  row.appendChild(valueInput);
  row.appendChild(note);
  row.appendChild(remove);
  return row;
}

function selectedEntry(option){
  return (option.entries || []).find((entry) => Number(entry.value) > 0) || (option.entries || [])[0] || {key:"", value:"0", note:""};
}

function normalizeBooleanKey(value){
  return String(value || "").trim().toLowerCase();
}

function defaultRangeValue(option, selected){
  if(selected && isNumericText(selected.key)) return Number(selected.key);
  const equivalent = selected ? equivalentValue(selected.note) : null;
  if(equivalent !== null) return equivalent;
  const normal = (option.entries || []).find((entry) => entry.key === "normal");
  const normalEquivalent = normal ? equivalentValue(normal.note) : null;
  if(normalEquivalent !== null) return normalEquivalent;
  const numeric = (option.entries || []).find((entry) => isNumericText(entry.key));
  if(numeric) return Number(numeric.key);
  const min = Number(option.rangeMin);
  const max = Number(option.rangeMax);
  if(Number.isFinite(min) && Number.isFinite(max)) return Math.round((min + max) / 2);
  return Number.isFinite(min) ? min : 0;
}

function equivalentValue(note){
  const match = String(note || "").match(/equivalent to\s+(-?\d+)/i);
  return match ? Number(match[1]) : null;
}

function humanizeValue(value){
  const text = String(value ?? "");
  if(text === "__custom__") return "Custom value";
  return text.replace(/^['"]|['"]$/g, "").replace(/[_-]+/g, " ").replace(/\b\w/g, (char) => char.toUpperCase());
}

function clamp(value, min, max){
  const safe = Number.isFinite(value) ? value : min;
  return Math.max(min, Math.min(max, safe));
}

function bindEvents(){
  els.playerName.addEventListener("input", updateAll);
  els.description.addEventListener("input", updateAll);
  els.requiresVersion.addEventListener("input", updateAll);
  els.searchBox.addEventListener("input", filterOptions);
  els.groupFilter.addEventListener("change", filterOptions);
  els.copyBtn.addEventListener("click", copyYaml);
  els.downloadBtn.addEventListener("click", downloadYaml);
}

function updateAll(){
  els.yamlOutput.value = buildYaml();
  els.yamlStatus.textContent = validateState();
  els.statusLine.textContent = `${els.yamlOutput.value.split("\n").length - 1} YAML lines generated`;
  filterOptions();
}

function filterOptions(){
  const query = (els.searchBox.value || "").trim().toLowerCase();
  const group = els.groupFilter.value;
  let visible = 0;
  document.querySelectorAll(".groupSection").forEach((section) => {
    let sectionVisible = 0;
    section.querySelectorAll(".optionBlock").forEach((block) => {
      const matchesGroup = !group || block.dataset.group === group;
      const matchesQuery = !query || block.dataset.search.includes(query);
      const show = matchesGroup && matchesQuery;
      block.classList.toggle("hidden", !show);
      if(show){
        visible += 1;
        sectionVisible += 1;
      }
    });
    section.classList.toggle("hidden", sectionVisible === 0);
  });
  els.visibleCount.textContent = `${visible} visible`;
}

function validateState(){
  if(!(els.playerName.value || "").trim()) return "Needs Name";
  if(!PAGE_DATA.options.length) return "No Options";
  return "Ready";
}

function buildYaml(){
  const lines = [];
  lines.push(`# Generated by ${PAGE_DATA.fileName}`);
  lines.push(`# Source: ${PAGE_DATA.sourceName}`);
  lines.push(`name: ${yamlScalar((els.playerName.value || "").trim() || "Player")}`);
  lines.push(`description: ${yamlScalar((els.description.value || "").trim() || `${PAGE_DATA.game} player options.`, true)}`);
  lines.push(`game: ${yamlScalar(PAGE_DATA.game, true)}`);

  const version = (els.requiresVersion.value || "").trim();
  if(version || PAGE_DATA.worldVersion){
    lines.push("requires:");
    if(version) lines.push(`  version: ${yamlScalar(version)}`);
    if(PAGE_DATA.worldVersion){
      lines.push("  game:");
      lines.push(`    ${yamlKey(PAGE_DATA.game)}: ${yamlScalar(PAGE_DATA.worldVersion)}`);
    }
  }

  lines.push("");
  lines.push(`${yamlKey(PAGE_DATA.game)}:`);

  PAGE_DATA.options.forEach((option) => {
    const block = document.querySelector(`[data-option-key="${cssEscape(option.key)}"]`);
    if(!block) return;
    if(option.control === "toggle"){
      const checked = block.querySelector(".weightedToggle").checked;
      appendWeightedSelection(lines, option, checked ? "true" : "false");
    }else if(option.control === "choice"){
      const selected = block.querySelector(".choiceSelect").value;
      appendWeightedSelection(lines, option, selected);
    }else if(option.control === "range"){
      const mode = block.querySelector(".rangeMode").value;
      if(mode === "__custom__"){
        appendWeightedRangeSelection(lines, option, block.querySelector(".rangeNumber").value);
      }else{
        appendWeightedSelection(lines, option, mode);
      }
    }else if(option.control === "map"){
      appendMapEntries(lines, option, block);
    }else{
      const raw = block.querySelector(".rawInput").value;
      appendRawOption(lines, option.key, raw);
    }
  });

  return lines.join("\n") + "\n";
}

function appendWeightedSelection(lines, option, selectedKey){
  lines.push(`  ${yamlKey(option.key)}:`);
  let found = false;
  (option.entries || []).forEach((entry) => {
    const selected = String(entry.key) === String(selectedKey);
    if(selected) found = true;
    lines.push(`    ${yamlKey(entry.key)}: ${selected ? 50 : 0}`);
  });
  if(!found && selectedKey){
    lines.push(`    ${yamlKey(selectedKey)}: 50`);
  }
}

function appendWeightedRangeSelection(lines, option, rawValue){
  const min = Number.isFinite(Number(option.rangeMin)) ? Number(option.rangeMin) : 0;
  const max = Number.isFinite(Number(option.rangeMax)) ? Number(option.rangeMax) : 99;
  const selectedKey = String(clamp(Math.round(Number(rawValue || min)), min, max));
  lines.push(`  ${yamlKey(option.key)}:`);
  let found = false;
  (option.entries || []).forEach((entry) => {
    const selected = String(entry.key) === selectedKey;
    if(selected) found = true;
    lines.push(`    ${yamlKey(entry.key)}: ${selected ? 50 : 0}`);
  });
  if(!found){
    lines.splice(lines.length - (option.entries || []).length, 0, `    ${yamlKey(selectedKey)}: 50`);
  }
}

function appendMapEntries(lines, option, block){
  const rows = [...block.querySelectorAll(".entryRow")].map((row) => {
    const key = row.querySelector(".entryKey").value.trim();
    const value = row.querySelector(".entryValue").value.trim();
    return {key, value};
  }).filter((entry) => entry.key);
  if(!rows.length){
    lines.push(`  ${yamlKey(option.key)}: {}`);
    return;
  }
  lines.push(`  ${yamlKey(option.key)}:`);
  rows.forEach((entry) => {
    lines.push(`    ${yamlKey(entry.key)}: ${yamlValue(entry.value || "0")}`);
  });
}

function appendRawOption(lines, key, raw){
  const text = String(raw || "").trim();
  if(!text){
    lines.push(`  ${yamlKey(key)}: []`);
    return;
  }
  if(!text.includes("\n")){
    lines.push(`  ${yamlKey(key)}: ${text}`);
    return;
  }
  lines.push(`  ${yamlKey(key)}:`);
  const rawLines = text.replace(/\s+$/g, "").split("\n");
  const filled = rawLines.filter((line) => line.trim());
  const minIndent = filled.reduce((min, line) => Math.min(min, line.match(/^\s*/)[0].length), Infinity);
  rawLines.forEach((line) => {
    lines.push(line.trim() ? "    " + line.slice(minIndent) : "");
  });
}

async function copyYaml(){
  const text = els.yamlOutput.value;
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
    }else{
      els.yamlOutput.focus();
      els.yamlOutput.select();
      document.execCommand("copy");
      els.yamlOutput.setSelectionRange(0, 0);
    }
    flashStatus("Copied");
  }catch(_){
    els.yamlOutput.focus();
    els.yamlOutput.select();
    flashStatus("Selected");
  }
}

function downloadYaml(){
  const name = sanitizeFileName((els.playerName.value || "").trim() || PAGE_DATA.slug || "Player");
  const blob = new Blob([els.yamlOutput.value], {type:"text/yaml;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = `${name}.yaml`;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 500);
  flashStatus("Downloaded");
}

function flashStatus(text){
  els.yamlStatus.textContent = text;
  clearTimeout(flashStatus.timer);
  flashStatus.timer = setTimeout(updateAll, 900);
}

function yamlScalar(value, forceQuote = false){
  const text = String(value ?? "");
  if(!forceQuote && /^-?\d+(\.\d+)?$/.test(text)) return text;
  if(!forceQuote && /^[A-Za-z0-9_./-]+$/.test(text) && !isYamlKeyword(text)) return text;
  return `"${text.replace(/\\/g, "\\\\").replace(/"/g, '\\"')}"`;
}

function yamlKey(value){
  const text = String(value ?? "");
  if(/^-?\d+(\.\d+)?$/.test(text)) return text;
  if(/^[A-Za-z0-9_./-]+$/.test(text) && !isYamlKeyword(text)) return text;
  return `'${text.replace(/'/g, "''")}'`;
}

function yamlValue(value){
  const text = String(value ?? "").trim();
  if(!text) return "0";
  if(/^-?\d+(\.\d+)?$/.test(text)) return text;
  if(/^(true|false|null)$/i.test(text)) return text.toLowerCase();
  if(/^(\[|\{|'|"|>|\||!|&|\*)/.test(text)) return text;
  return yamlScalar(text, true);
}

function isYamlKeyword(value){
  return /^(true|false|null|yes|no|on|off|y|n)$/i.test(String(value));
}

function isNumericText(value){
  return /^-?\d+(\.\d+)?$/.test(String(value || "").trim());
}

function sanitizeFileName(value){
  return String(value || "Player").replace(/[^A-Za-z0-9_.-]+/g, "_").replace(/^_+|_+$/g, "") || "Player";
}

function cssEscape(value){
  if(window.CSS && CSS.escape) return CSS.escape(value);
  return String(value).replace(/["\\]/g, "\\$&");
}

function escapeHtml(value){
  return String(value ?? "").replace(/[&<>"']/g, (char) => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[char]);
}

document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
